<script>
/* =========================================================================
   GRAYSON'S APP — adaptive Math, English & History practice
   Single-file static app. No build step. Deployable as-is to GitHub Pages.
   Progress persists locally (localStorage) and, once configured, syncs
   across devices via Firebase (see SYNC section near the bottom).
   ========================================================================= */

/* ---------------------------------------------------------------------
   1. CURRICULUM
   - math / english: procedurally-generated drill topics, 4 difficulty
     tiers each, mapped to Year 2 (Basics) -> Year 2 (Advanced) -> Year 3
     -> Year 4 so progress reads as moving through real school years.
   - history: US history at a US grade 1-2 level (Grayson isn't taught
     this in the UK, so every topic opens with a short primer paragraph
     before any question — no assumed context).
   --------------------------------------------------------------------- */
const CURRICULUM = {
  math: {
    label: "Math",
    icon: "🚗",
    tierLabels: ["Year 2 (Basics)","Year 2 (Advanced)","Year 3","Year 4"],
    yearForTier: [2,2,3,4],
    topics: [
      {id:"place_value",  name:"Number & Place Value"},
      {id:"add_sub",      name:"Addition & Subtraction"},
      {id:"mult_div",     name:"Multiplication & Division"},
      {id:"fractions",    name:"Fractions & Decimals"},
      {id:"measurement",  name:"Measurement, Time & Money"},
      {id:"geometry",     name:"Shape, Angles & Position"},
      {id:"statistics",   name:"Data & Statistics"},
      {id:"reasoning",    name:"Word Problems & Reasoning"},
    ]
  },
  english: {
    label: "English",
    icon: "📚",
    tierLabels: ["Year 2 (Basics)","Year 2 (Advanced)","Year 3","Year 4"],
    yearForTier: [2,2,3,4],
    topics: [
      {id:"word_classes",       name:"Word Classes"},
      {id:"sentence_structure", name:"Sentences & Clauses"},
      {id:"punctuation",        name:"Punctuation"},
      {id:"tenses",             name:"Verb Tenses"},
      {id:"vocabulary",         name:"Vocabulary & Spelling"},
      {id:"composition",        name:"Composition & Style"},
    ]
  },
  history: {
    label: "History",
    icon: "🦅",
    tierLabels: ["Getting Started","Building Understanding","Making Connections","Deeper Thinking"],
    isReading: true, // triggers the primer-then-questions round flow
    topics: [
      {id:"flag", name:"The American Flag",
        primer:"The flag of the United States has 50 white stars and 13 red and white stripes. Each star stands for one of the 50 states in the country today. The 13 stripes stand for the first 13 colonies that became the United States back in 1776. The flag is sometimes called \"Old Glory\" or \"the Stars and Stripes.\" Many Americans say the Pledge of Allegiance while looking at the flag, especially at school in the morning."},
      {id:"independence_day", name:"Independence Day",
        primer:"A long time ago, America was made up of 13 colonies ruled by Britain, far across the ocean. Many colonists felt this wasn't fair, because they had no say in the laws that governed them. On July 4, 1776, leaders signed the Declaration of Independence — a document saying the colonies were now a free country called the United States. That's why Americans celebrate the Fourth of July every year with fireworks, parades, and picnics. It's the country's birthday!"},
      {id:"washington", name:"George Washington",
        primer:"George Washington was a general who led American soldiers during the Revolutionary War — the fight for independence from Britain. After America won, Washington became the very first President of the United States, in 1789. He is sometimes called the \"Father of His Country.\" His face appears on the one-dollar bill and the quarter coin, and a giant carving of his face is on Mount Rushmore."},
      {id:"lincoln", name:"Abraham Lincoln",
        primer:"Abraham Lincoln was the 16th President of the United States. He led the country through the Civil War, a war between the Northern and Southern states. One of the biggest reasons for the war was slavery: some states wanted to keep enslaving people, while others wanted it to end. In 1863, Lincoln signed the Emancipation Proclamation, an important step toward ending slavery in the United States. Lincoln is remembered for his honesty and for helping hold the country together."},
      {id:"thanksgiving", name:"Thanksgiving",
        primer:"In 1620, a group of English settlers called the Pilgrims sailed across the ocean on a ship named the Mayflower and landed in what is now Massachusetts. Native American people, including the Wampanoag, were already living there and knew the land well. A Wampanoag man named Squanto helped the Pilgrims learn to grow corn and survive. In the fall of 1621, the Pilgrims and the Wampanoag shared a large harvest feast together — an event remembered today as the first Thanksgiving."},
      {id:"native_americans", name:"Native Americans",
        primer:"Long before any European settlers arrived, millions of Native American people were already living across the land that is now the United States. There were hundreds of different tribes and nations, each with its own language, traditions, and way of life — from the Wampanoag in the east, to the Navajo in the southwest, to the Lakota on the Great Plains. Native Americans were the first people to call this land home, and many tribes and nations are still part of American life today."},
      {id:"mlk", name:"Martin Luther King Jr.",
        primer:"Martin Luther King Jr. was a leader who worked to make sure Black Americans were treated fairly, during a time when unfair laws kept them separated from white Americans in schools, buses, and other public places. Dr. King believed in peaceful protest — marching and speaking out without violence. In 1963, he gave a famous speech called \"I Have a Dream,\" sharing his hope that one day everyone would be treated equally, no matter the color of their skin. Every January, the United States celebrates Martin Luther King Jr. Day in his honor."},
      {id:"statue_of_liberty", name:"The Statue of Liberty",
        primer:"The Statue of Liberty is a giant statue of a woman holding a torch, standing on an island in New York Harbor. France gave the statue to the United States as a gift in 1886, to celebrate friendship between the two countries and the idea of freedom. For many years, ships full of immigrants — people moving to America from other countries — passed by the statue as they arrived. It became a symbol of hope and welcome for a new life in America."},
      {id:"map_capital", name:"The Map & the Capital",
        primer:"The United States is made up of 50 states, from Hawaii in the Pacific Ocean to Maine on the Atlantic coast. The country's capital city — where the President lives and works — is Washington, D.C. It isn't part of any state; it's its own special district. The President lives and works in a building called the White House, and nearby is the Capitol Building, where the country's laws are made."},
    ]
  }
};

/* ---------------------------------------------------------------------
   2. HELPERS
   --------------------------------------------------------------------- */
function randInt(min,max){ return Math.floor(Math.random()*(max-min+1))+min; }
function pick(arr){ return arr[randInt(0,arr.length-1)]; }
function shuffle(arr){ const a=[...arr]; for(let i=a.length-1;i>0;i--){const j=randInt(0,i);[a[i],a[j]]=[a[j],a[i]];} return a; }
// Builds a multiple-choice question from a correct value + distractor pool, returns {options, correctIndex}
function makeMCQ(correct, distractorPool, fmt=(x)=>String(x)){
  // For every question in this app, a negative number is never a sensible
  // answer (ages, totals, money, sides, faces, subtraction results, fractions
  // of an amount, etc. are always >= 0). Guard here once, centrally, rather
  // than in every generator, so a distractor formula like "correct-10" can
  // never accidentally offer "-1" as a multiple-choice option.
  const nonNegativeCorrect = typeof correct === "number" && correct >= 0;
  const pool = distractorPool.filter(d => fmt(d) !== fmt(correct) && !(nonNegativeCorrect && typeof d === "number" && d < 0));
  const chosen = [];
  while(chosen.length < 3 && pool.length){
    const idx = randInt(0,pool.length-1);
    const val = pool.splice(idx,1)[0];
    if(!chosen.some(c=>fmt(c)===fmt(val))) chosen.push(val);
  }
  // If the pool didn't have 3 distinct distractors (common for binary true/false-
  // style items), only pad with numeric neighbors when correct is actually a
  // number — never fabricate nonsense text options for string answers.
  if(typeof correct === "number"){
    let offset = 1;
    while(chosen.length < 3 && offset < 50){
      for(const sign of [1,-1]){
        if(chosen.length>=3) break;
        const filler = correct + sign*offset;
        if(!chosen.some(c=>fmt(c)===fmt(filler)) && fmt(filler)!==fmt(correct) && filler>=0){
          chosen.push(filler);
        }
      }
      offset++;
    }
  }
  const all = shuffle([correct, ...chosen]);
  return { options: all.map(fmt), correctIndex: all.findIndex(v=>fmt(v)===fmt(correct)) };
}
// Builds a fixed-content comprehension question (used by History): same
// shuffling/dedup behaviour as makeMCQ, but for hand-written fact strings
// rather than generated numbers.
function makeFactMCQ(correct, wrongs, explain, q){
  const {options, correctIndex} = makeMCQ(correct, wrongs, (x)=>String(x));
  return {q, options, correctIndex, explain};
}

// Correctly forms -ing / -ed verb endings, respecting the "drop the silent e"
// spelling rule (explore -> exploring/explored, not exploreing/exploreed).
// Plain string concatenation broke on any verb ending in a silent e.
function ingForm(v){
  if(/[^aeiou]e$/.test(v)) return v.slice(0,-1) + "ing"; // explore -> exploring
  return v + "ing";
}
function edForm(v){
  if(/[^aeiou]e$/.test(v)) return v + "d"; // explore -> explored
  return v + "ed";
}

// Short, plain-English definitions for grammar terms, appended to
// explanations so a 6-year-old learns what the WORD means, not just the
// answer to this one question.
const GLOSSARY = {
  "Noun": "a person, place, or thing",
  "Verb": "a doing or action word",
  "Adjective": "a word that describes something",
  "Adverb": "a word that describes how something is done",
  "Pronoun": "a word that stands in for a name, like he, she, or it",
  "Conjunction": "a joining word, like and, but, or because",
  "Preposition": "a word that shows where something is, like under or beside",
  "Proper noun": "the special name of a person or place, like Grayson or London",
  "Common noun": "a general name for a thing, not its own special name",
  "Complete sentence": "a full thought that makes sense on its own",
  "Sentence fragment": "a piece of a sentence that isn't a full thought yet",
  "Simple sentence": "a sentence with just one idea in it",
  "Compound sentence": "two ideas joined together, usually with a word like and or but",
  "Subordinate clause": "a part of a sentence that can't stand alone",
  "Progressive tense": "shows something happening right now",
  "Future tense": "shows something that hasn't happened yet, but will",
  "Present perfect tense": "shows something that has already happened",
};
function withDef(term){
  const def = GLOSSARY[term];
  return def ? ` (${term.toLowerCase()} = ${def})` : "";
}

/* ---------------------------------------------------------------------
   3. QUESTION CONTENT
   - math / english: procedurally generated, unlimited variety.
   - history: fixed comprehension questions per topic, 4 per topic
     ordered easy -> harder (recall, recall, why, comprehension/inference).
   --------------------------------------------------------------------- */
const G = { math:{}, english:{}, history:{} };

// ---- MATH: Place Value ----
G.math.place_value = [
  () => { // tier0: numbers to 100, tens/ones
    const n = randInt(11,99);
    const correct = Math.floor(n/10)*10;
    const {options,correctIndex} = makeMCQ(correct, [correct-10,correct+10,correct+1,n]);
    return {q:`In the number ${n}, what is the value of the tens digit?`, options, correctIndex,
      explain:`${n} = ${Math.floor(n/10)} tens and ${n%10} ones, so the tens digit is worth ${correct}.`};
  },
  () => { // tier1: numbers to 1000, rounding to nearest 10
    const n = randInt(100,999);
    const correct = Math.round(n/10)*10;
    const {options,correctIndex} = makeMCQ(correct, [correct-10,correct+10,n]);
    return {q:`Round ${n} to the nearest 10.`, options, correctIndex, explain:`${n} rounds to ${correct}.`};
  },
  () => { // tier2: numbers to 10,000, rounding to nearest 100, negatives
    const n = randInt(1000,9999);
    const correct = Math.round(n/100)*100;
    const {options,correctIndex} = makeMCQ(correct, [correct-100,correct+100,n]);
    return {q:`Round ${n} to the nearest 100.`, options, correctIndex, explain:`${n} rounds to ${correct}.`};
  },
  () => { // tier3: ordering negative numbers / rounding to 1000
    const n = randInt(1000,99999);
    const correct = Math.round(n/1000)*1000;
    const {options,correctIndex} = makeMCQ(correct, [correct-1000,correct+1000,n]);
    return {q:`Round ${n} to the nearest 1,000.`, options, correctIndex, explain:`${n} rounds to ${correct}.`};
  }
];

// ---- MATH: Addition & Subtraction ----
G.math.add_sub = [
  () => { const a=randInt(10,49), b=randInt(10,49-a%10<10?9:9); const correct=a+b;
    const {options,correctIndex}=makeMCQ(correct,[correct-10,correct+10,correct-1,correct+1]);
    return {q:`${a} + ${b} = ?`, options, correctIndex, explain:`${a} + ${b} = ${correct}.`}; },
  () => { const a=randInt(20,89), b=randInt(15,79); const useSub = Math.random()<0.5;
    const correct = useSub ? Math.abs(a-b) : a+b;
    const {options,correctIndex}=makeMCQ(correct,[correct-10,correct+10,correct-1,correct+1]);
    return {q: useSub?`${Math.max(a,b)} - ${Math.min(a,b)} = ?`:`${a} + ${b} = ?`, options, correctIndex,
      explain:`Answer: ${correct}.`}; },
  () => { const a=randInt(100,899), b=randInt(100,899); const useSub = Math.random()<0.5;
    const correct = useSub ? Math.abs(a-b) : a+b;
    const {options,correctIndex}=makeMCQ(correct,[correct-10,correct+10,correct-100,correct+100]);
    return {q: useSub?`${Math.max(a,b)} - ${Math.min(a,b)} = ?`:`${a} + ${b} = ?`, options, correctIndex,
      explain:`Answer: ${correct}.`}; },
  () => { const a=randInt(1000,8999), b=randInt(100,999); const useSub = Math.random()<0.5;
    const correct = useSub ? a-b : a+b;
    const {options,correctIndex}=makeMCQ(correct,[correct-100,correct+100,correct-10,correct+10]);
    return {q: useSub?`${a} - ${b} = ?`:`${a} + ${b} = ?`, options, correctIndex, explain:`Answer: ${correct}.`}; }
];

// ---- MATH: Multiplication & Division ----
G.math.mult_div = [
  () => { const table=pick([2,5,10]); const n=randInt(1,12); const correct=table*n;
    const {options,correctIndex}=makeMCQ(correct,[correct-table,correct+table,correct+1]);
    return {q:`${table} × ${n} = ?`, options, correctIndex, explain:`${table} × ${n} = ${correct}.`}; },
  () => { const table=randInt(2,12); const n=randInt(1,12); const isDiv=Math.random()<0.4;
    if(isDiv){ const correct=n; const product=table*n;
      const {options,correctIndex}=makeMCQ(correct,[correct-1,correct+1,correct+2]);
      return {q:`${product} ÷ ${table} = ?`, options, correctIndex, explain:`${product} ÷ ${table} = ${correct}.`}; }
    const correct=table*n;
    const {options,correctIndex}=makeMCQ(correct,[correct-table,correct+table,correct+1]);
    return {q:`${table} × ${n} = ?`, options, correctIndex, explain:`${table} × ${n} = ${correct}.`}; },
  () => { const a=randInt(11,49), b=randInt(2,9); const correct=a*b;
    const {options,correctIndex}=makeMCQ(correct,[correct-b,correct+b,correct-a]);
    return {q:`${a} × ${b} = ?`, options, correctIndex, explain:`${a} × ${b} = ${correct}.`}; },
  () => { const divisor=randInt(3,9); const quotient=randInt(4,15); const rem=randInt(1,divisor-1);
    const dividend=divisor*quotient+rem; const correct=`${quotient} r${rem}`;
    const wrongs=[`${quotient} r${(rem+1)%divisor}`,`${quotient+1} r${rem}`,`${quotient-1} r${rem}`];
    const {options,correctIndex}=makeMCQ(correct,wrongs,(x)=>String(x));
    return {q:`${dividend} ÷ ${divisor} = ? (give remainder)`, options, correctIndex,
      explain:`${divisor} × ${quotient} = ${divisor*quotient}, remainder ${rem}.`}; }
];

// ---- MATH: Fractions & Decimals ----
G.math.fractions = [
  () => { const denom=pick([2,4]); const correct=`1/${denom}`;
    const wrongs=[`1/${denom===2?4:2}`,`${denom-1}/${denom}`,`2/${denom}`];
    const {options,correctIndex}=makeMCQ(correct,wrongs);
    return {q:`A shape is split into ${denom} equal parts and 1 part is shaded. What fraction is shaded?`,
      options, correctIndex, explain:`1 shaded part out of ${denom} equal parts = 1/${denom}.`}; },
  () => { const denom=pick([2,3,4,5]); const mult=randInt(2,4);
    const correct=`${1*mult}/${denom*mult}`;
    const wrongs=[`1/${denom}`,`${mult}/${denom}`,`${1*mult}/${denom+mult}`];
    const {options,correctIndex}=makeMCQ(correct,wrongs);
    return {q:`Which fraction is equivalent to 1/${denom}?`, options, correctIndex,
      explain:`Multiply top and bottom by ${mult}: 1/${denom} = ${1*mult}/${denom*mult}.`}; },
  () => { const denom=pick([2,4,5,10]); const whole=randInt(20,100); const correct=(whole/denom);
    const {options,correctIndex}=makeMCQ(correct,[correct+denom,correct-denom,whole/2]);
    return {q:`What is 1/${denom} of ${whole}?`, options, correctIndex, explain:`${whole} ÷ ${denom} = ${correct}.`}; },
  () => { const tenths=randInt(1,9); const correct=`0.${tenths}`;
    const wrongs=[`${tenths}.0`,`0.0${tenths}`,`1.${tenths}`];
    const {options,correctIndex}=makeMCQ(correct,wrongs);
    return {q:`Write ${tenths}/10 as a decimal.`, options, correctIndex, explain:`${tenths}/10 = 0.${tenths}.`}; }
];

// ---- MATH: Measurement, Time & Money ----
G.math.measurement = [
  () => { const h=randInt(1,12); const half=Math.random()<0.5;
    const correct = half ? `Half past ${h}` : `${h} o'clock`;
    const wrongs = [`Half past ${h===12?1:h+1}`,`${h===12?1:h+1} o'clock`,`Quarter past ${h}`];
    const {options,correctIndex}=makeMCQ(correct,wrongs);
    return {q:`The clock shows ${h}:${half?"30":"00"}. What time is this?`, options, correctIndex,
      explain:`${h}:${half?"30":"00"} is "${correct}".`}; },
  () => { const pounds=randInt(1,9), pence=pick([0,25,50,75]); const correct=`£${pounds}.${pence.toString().padStart(2,"0")}`;
    const wrongs=[`£${pounds+1}.${pence.toString().padStart(2,"0")}`,`£${pounds}.${(100-pence)===100?"00":(100-pence)}`,`£${pounds}.${pence===0?"50":"00"}`];
    const {options,correctIndex}=makeMCQ(correct,wrongs,(x)=>String(x));
    return {q:`I have coins worth £${pounds}.${pence.toString().padStart(2,"0")} in total. How is that written?`,
      options, correctIndex, explain:`Written as ${correct}.`}; },
  () => { const h=randInt(1,23); const m=pick([0,15,30,45]); const period = h<12?"am":"pm";
    const h12 = h%12===0?12:h%12; const correct=`${h12}:${m.toString().padStart(2,"0")} ${period}`;

    "The passage says the statue was given as a gift in 1886.",
    "In what year was the Statue of Liberty given as a gift?"),
  () => makeFactMCQ("It welcomed people arriving in America for a new life", ["It was the tallest building", "It was free to visit", "It was built by immigrants"],
    "Ships full of immigrants passed by the statue as they arrived, and it became a symbol of hope and welcome.",
    "Why did the Statue of Liberty become a symbol of hope for immigrants?"),
];
G.history.map_capital = [
  () => makeFactMCQ("50", ["13","48","52"], "The United States is made up of 50 states.",
    "How many states make up the United States?"),
  () => makeFactMCQ("Washington, D.C.", ["New York City","Philadelphia","Boston"],
    "The passage says the country's capital city is Washington, D.C.",
    "What is the name of the country's capital city?"),
  () => makeFactMCQ("The White House", ["The Capitol Building","Mount Rushmore","The Mayflower"],
    "The passage says the President lives and works in a building called the White House.",
    "What is the name of the building where the President lives?"),
  () => makeFactMCQ("The Capitol Building", ["The White House","The Statue of Liberty","Mount Rushmore"],
    "The passage says the country's laws are made nearby, in the Capitol Building.",
    "Where are the country's laws made?"),
];

/* ---------------------------------------------------------------------
   4. STATE & PERSISTENCE (localStorage now; Firebase hook below)
   --------------------------------------------------------------------- */
const STORAGE_KEY = "graysons_app_state_v1";

function defaultTopicState(){
  // Starts at true tier 0 ("Basics") — a topic he hasn't played yet should
  // never look like it's already at "Advanced" before he's answered anything.
  return { tier:0, correctStreak:0, wrongStreak:0, attempts:0, correct:0, needsReview:false, roundsSince:0 };
}
function defaultState(){
  const s = { history:[], updatedAt:0 };
  for(const subj of Object.keys(CURRICULUM)){
    s[subj] = { topics:{} };
    for(const t of CURRICULUM[subj].topics){
      s[subj].topics[t.id] = defaultTopicState();
    }
  }
  return s;
}
// Migrates any state saved by an older version of the app (missing fields,
// or a whole subject that didn't exist yet, like History) so upgrading
// never crashes or loses progress.
function migrateState(s){
  for(const subj of Object.keys(CURRICULUM)){
    if(!s[subj]) s[subj] = {topics:{}};
    if(!s[subj].topics) s[subj].topics = {};
    for(const t of CURRICULUM[subj].topics){
      const existing = s[subj].topics[t.id];
      if(!existing){ s[subj].topics[t.id] = defaultTopicState(); continue; }
      if(existing.correctStreak === undefined) existing.correctStreak = existing.streak || 0;
      if(existing.wrongStreak === undefined) existing.wrongStreak = 0;
      delete existing.streak;
      if(existing.tier === undefined) existing.tier = 0;
      if(existing.attempts === undefined) existing.attempts = 0;
      if(existing.correct === undefined) existing.correct = 0;
      if(existing.needsReview === undefined) existing.needsReview = false;
      if(existing.roundsSince === undefined) existing.roundsSince = 0;
    }
  }
  if(s.updatedAt === undefined) s.updatedAt = 0;
  if(!s.history || Array.isArray(s.history) === false){
    // "history" used to be a leftover empty array placeholder in older
    // saves; Object.keys(CURRICULUM) above already turned it into a proper
    // subject object, so nothing further to do here — this branch only
    // guards against a stale array literal surviving migration.
  }
  return s;
}
function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) return migrateState(JSON.parse(raw));
  }catch(e){}
  return defaultState();
}
function saveState(state){
  state.updatedAt = Date.now();
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  cloudSync(state); // no-op until Firebase is configured, see SYNC section
}
// Writes a state we just pulled FROM the cloud back into localStorage without
// re-triggering a cloud write (it already lives there) — keeps the two in
// sync without an infinite read/write ping-pong.
function saveStateLocalOnly(state){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

let STATE = loadState();

/* ---------------------------------------------------------------------
   5. ADAPTIVE ENGINE
   --------------------------------------------------------------------- */

// Once-per-round bookkeeping: topics NOT visited this round get "older"
// (roundsSince++), topics visited get reset to 0 ("just practiced"). This
// used to run per-answer, which over-counted multi-question topics (like
// History's primer-then-several-questions visits) and skewed rotation.
function bumpRoundCounters(subject, touchedTopicIds){
  const touched = new Set(touchedTopicIds);
  for(const t of CURRICULUM[subject].topics){
    const s = STATE[subject].topics[t.id];
    s.roundsSince = touched.has(t.id) ? 0 : s.roundsSince + 1;
  }
}

// Generates one question for a topic at its current tier, retrying a few
// times if it collides with a question already used elsewhere in this same
// round (procedural generators occasionally roll identical numbers; fixed
// content like History can't collide since each visit uses distinct indices).
function questionForTopic(subject, topicId, usedTexts){
  const tier = STATE[subject].topics[topicId].tier;
  const gens = G[subject][topicId];
  let q, attempts = 0;
  do {
    q = gens[Math.min(tier, gens.length-1)]();
    attempts++;
  } while(usedTexts.has(q.q) && attempts < 15);
  usedTexts.add(q.q);
  return { topicId, tier, ...q };
}

function questionsForTopicOrder(subject, order){
  const usedTexts = new Set();
  return order.map(topicId => questionForTopic(subject, topicId, usedTexts));
}

// Standard (math/english) round: exactly one question per topic, every
// topic covered, nothing repeated within the round. Extra reinforcement for
// weak topics happens through the dedicated bonus round instead of padding
// the main round with repeats — that way a gap gets focused practice at its
// own level without ever colliding with (or crowding out) other topics.
function pickTopicOrder(subject){
  return shuffle(CURRICULUM[subject].topics.map(t=>t.id));
}

function buildRound(subject){
  if(CURRICULUM[subject].isReading) return buildHistoryRound(subject);
  const order = pickTopicOrder(subject);
  bumpRoundCounters(subject, order);
  return questionsForTopicOrder(subject, order);
}

// History topic selection: breadth first. Picks whichever topics have gone
// longest without being visited, so all 9 topics rotate through before any
// one of them repeats. (Topics he's struggling with still get attention —
// via the bonus round below — rather than monopolizing the main rotation,
// which is what was causing the same history questions to resurface every
// round.)
const HISTORY_TOPICS_PER_ROUND = 3;
function pickHistoryTopicsForRotation(subject, count){
  const topics = CURRICULUM[subject].topics.map(t=>t.id);
  const s = STATE[subject].topics;
  const byStaleness = [...topics].sort((a,b) => s[b].roundsSince - s[a].roundsSince);
  return byStaleness.slice(0, count);
}

// History round: pick a handful of topics; for each, unlock more of its 4
// fixed comprehension questions as its tier rises (2 at tier0, 3 at tier1,
// all 4 at tier2+), primer shown once before the first question of that topic.
function buildHistoryRound(subject, topicIdsOverride){
  const topicIds = topicIdsOverride || pickHistoryTopicsForRotation(subject, HISTORY_TOPICS_PER_ROUND);
  if(!topicIdsOverride) bumpRoundCounters(subject, topicIds);
  const out = [];
  for(const topicId of topicIds){
    const tier = STATE[subject].topics[topicId].tier;
    const unlockCount = Math.min(tier+2, 4);
    const topicDef = CURRICULUM[subject].topics.find(t=>t.id===topicId);
    const qFns = G[subject][topicId];
    for(let i=0;i<unlockCount;i++){
      const q = qFns[i]();
      out.push({ topicId, tier, primer: i===0 ? topicDef.primer : null, ...q });
    }
  }
  return out;
}

// Bonus round: focused practice on exactly the topics that gave trouble
// last round, at their CURRENT (already-weak) tier — this is deliberately
// where repeats/reinforcement live, so the main round stays gap-free and a
// struggling topic gets deeper practice without skipping ahead to harder
// content or crowding out topics he's already solid on.
function buildBonusRound(subject, topicIds){
  if(!topicIds || !topicIds.length) return [];
  if(CURRICULUM[subject].isReading) return buildHistoryRound(subject, topicIds);
  const shuffledBase = shuffle(topicIds);
  const order = [];
  for(let i=0;i<10;i++) order.push(shuffledBase[i % shuffledBase.length]);
  return questionsForTopicOrder(subject, order);
}

// Leveling rule: a topic only gets harder once it's been answered correctly
// twice in a row at the current tier (no mistakes in between). A topic only
// gets easier after two mistakes in a row at the current tier — a single
// slip doesn't knock him down a level, it just flags the topic for a bit
// more practice. Tier is capped 0-3 (Year 2 Basics through Year 4), so a
// mastered topic never goes past the Year 4 ceiling. Returns what happened
// so the UI can explain it.
function recordAnswer(subject, topicId, wasCorrect){
  const t = STATE[subject].topics[topicId];
  const tierBefore = t.tier;
  t.attempts++;
  let leveledUp = false, leveledDown = false;
  if(wasCorrect){
    t.correct++; t.correctStreak++; t.wrongStreak = 0;
    if(t.correctStreak >= 2){
      t.needsReview = false;
      if(t.tier < 3){ t.tier++; leveledUp = true; }
      t.correctStreak = 0;
    }
  } else {
    t.wrongStreak++; t.correctStreak = 0;
    t.needsReview = true;
    if(t.wrongStreak >= 2 && t.tier > 0){ t.tier--; leveledDown = true; t.wrongStreak = 0; }
  }
  saveState(STATE);
  return { tierBefore, tierAfter: t.tier, leveledUp, leveledDown };
}

// Subject-wide "year" for math/english: the year of the topic he's weakest
// in, since the goal is uniform mastery, not racing ahead on his favourite
// topic while others lag. Returns null for subjects without yearForTier
// (e.g. History, which uses depth labels instead of years).
function subjectYear(subject){
  const cfg = CURRICULUM[subject];
  if(!cfg.yearForTier) return null;
  const tiers = cfg.topics.map(t => STATE[subject].topics[t.id].tier);
  return Math.min(...tiers.map(t => cfg.yearForTier[t]));
}

/* ---------------------------------------------------------------------
   6. SYNC (Firebase) — keeps Mac + iPad (and any other device) showing the
   same progress. Uses a single Firestore document, no login/account for
   Grayson required. Access is gated by PROGRESS_DOC_ID acting as a shared,
   hard-to-guess key (matched against a Firestore security rule), rather
   than by user auth — appropriate for a single-family, no-login kids app.

   To activate:
   1. Fill in FIREBASE_CONFIG with the config object from your Firebase
      project's web app settings.
   2. Fill in PROGRESS_DOC_ID with the same random ID used in your
      Firestore security rule (see SETUP.md for the exact rule text).
   3. Set SYNC_ENABLED = true.
   Until all three are done, the app works exactly as before — fully
   offline, localStorage only, nothing changes.
   --------------------------------------------------------------------- */
const SYNC_ENABLED = false;
const FIREBASE_CONFIG = null; // { apiKey:"...", authDomain:"...", projectId:"...", ... }
const PROGRESS_DOC_ID = null; // e.g. "grayson-9f3a1c7e" — must match the Firestore rule

let fbDb = null;
if(SYNC_ENABLED && FIREBASE_CONFIG && PROGRESS_DOC_ID && typeof firebase !== "undefined"){
  try{
    firebase.initializeApp(FIREBASE_CONFIG);
    fbDb = firebase.firestore();
  }catch(e){ fbDb = null; } // misconfigured or offline — app still works locally
}

// Best-effort push to the cloud. Never blocks or breaks gameplay: local save
// (localStorage) has already succeeded by the time this is called, so a
// failed/offline cloud write just means the NEXT successful save catches up.
function cloudSync(state){
  if(!fbDb) return;
  fbDb.collection("progress").doc(PROGRESS_DOC_ID).set(state).catch(()=>{});
}
// Pulls whatever's currently in the cloud, or null if sync is off/offline/
// nothing saved there yet.
function cloudPull(){
  if(!fbDb) return Promise.resolve(null);
  return fbDb.collection("progress").doc(PROGRESS_DOC_ID).get()
    .then(snap => snap.exists ? snap.data() : null)
    .catch(()=>null);
}

/* ---------------------------------------------------------------------
   7. UI
   --------------------------------------------------------------------- */
const app = document.getElementById("app");
let currentRound = null, currentIndex = 0, currentSubject = null, roundResults = [];
let currentRoundMode = "normal"; // "normal" | "bonus"
let primerAcknowledged = {}; // topicId -> true, once its primer has been shown this round
let yearBeforeRound = null; // subjectYear() snapshot taken at round start, for celebrating advances

function renderHome(){
  const subjectButtons = Object.keys(CURRICULUM).map((subj,i)=>{
    const cfg = CURRICULUM[subj];
    const wide = Object.keys(CURRICULUM).length % 2 === 1 && i === Object.keys(CURRICULUM).length-1;
    return `<button class="subject-btn ${subj}${wide?' full-width':''}" onclick="startRound('${subj}')">
      <span class="icon">${cfg.icon}</span> ${cfg.label}
    </button>`;
  }).join("");
  app.innerHTML = `
    <div class="card">
      <h1>🚀 Grayson's App</h1>
      <p class="subtitle">Pick a subject to get started.</p>
      <div class="subject-grid">${subjectButtons}</div>
      <button class="dashboard-btn" onclick="renderDashboard()">View progress</button>
      <p class="footer-note">${SYNC_ENABLED ? "Progress syncs across devices. " : "Runs fully offline once loaded. "}No account needed to play.</p>
    </div>`;
}

function startRound(subject, focusTopicIds){
  currentSubject = subject;
  primerAcknowledged = {};
  yearBeforeRound = subjectYear(subject);
  if(focusTopicIds && focusTopicIds.length){
    currentRound = buildBonusRound(subject, focusTopicIds);
    currentRoundMode = "bonus";
  } else {
    currentRound = buildRound(subject);
    currentRoundMode = "normal";
  }
  currentIndex = 0;
  roundResults = [];
  if(!currentRound.length){ renderHome(); return; }
  renderQuestion();
}

function renderPrimer(q){
  const topicName = CURRICULUM[currentSubject].topics.find(t=>t.id===q.topicId).name;
  app.innerHTML = `
    <div class="card">
      <button class="back-link" onclick="renderHome()">Exit</button>
      <span class="qtag">${topicName}</span>
      <p class="primer-text">📖 ${q.primer}</p>
      <button class="next-btn" onclick="acknowledgePrimer()">I've read it — let's go!</button>
    </div>`;
}
function acknowledgePrimer(){
  primerAcknowledged[currentRound[currentIndex].topicId] = true;
  renderQuestion();
}

function renderQuestion(){
  const q = currentRound[currentIndex];
  if(q.primer && !primerAcknowledged[q.topicId]){ renderPrimer(q); return; }
  const total = currentRound.length;
  const dots = currentRound.map((_,i)=>{
    let cls = "progress-dot";
    if(i < currentIndex) cls += " done";
    else if(i === currentIndex) cls += " current";
    return `<div class="${cls}"></div>`;
  }).join("");
  const topicName = CURRICULUM[currentSubject].topics.find(t=>t.id===q.topicId).name;
  app.innerHTML = `
    <div class="card">
      <button class="back-link" onclick="renderHome()">Exit</button>
      <div class="progress-strip">${dots}</div>
      <span class="qtag${currentRoundMode==='bonus'?' bonus':''}">${currentRoundMode==='bonus'?'Bonus · ':''}${topicName} · Q${currentIndex+1} of ${total}</span>
      <p class="question">${q.q}</p>
      <div class="options" id="options">
        ${q.options.map((opt,i)=>`<button class="opt" data-i="${i}" onclick="answer(${i})">${opt}</button>`).join("")}
      </div>
      <div id="feedbackZone"></div>
    </div>`;
}

function answer(i){
  const q = currentRound[currentIndex];
  const wasCorrect = i === q.correctIndex;
  document.querySelectorAll(".opt").forEach((btn,idx)=>{
    btn.onclick = null;
    if(idx === q.correctIndex) btn.classList.add("correct");
    else if(idx === i) btn.classList.add("incorrect");
  });
  const topicName = CURRICULUM[currentSubject].topics.find(t=>t.id===q.topicId).name;
  const result = recordAnswer(currentSubject, q.topicId, wasCorrect);
  roundResults.push({
    topicId:q.topicId, topicName, correct:wasCorrect,
    question:q.q, explain:q.explain, leveledUp:result.leveledUp, leveledDown:result.leveledDown
  });
  const fb = document.getElementById("feedbackZone");
  const levelNote = result.leveledUp
    ? `<div class="explain" style="color:#16a34a; font-weight:600;">⬆ Leveled up in ${topicName} — two correct in a row at this level!</div>`
    : "";
  fb.innerHTML = `
    <div class="feedback ${wasCorrect?"good":"bad"}">${wasCorrect?"Nice one! ✅":"Not quite — here's why:"}</div>
    <div class="explain">${q.explain}</div>
    ${levelNote}
    <button class="next-btn" onclick="nextQuestion()">${currentIndex+1 < currentRound.length ? "Next question" : "See results"}</button>`;
}

function nextQuestion(){
  currentIndex++;
  if(currentIndex >= currentRound.length){ renderSummary(); return; }
  renderQuestion();
}

function renderSummary(){
  const correctCount = roundResults.filter(r=>r.correct).length;
  const total = roundResults.length;
  const pct = Math.round((correctCount/total)*100);
  const emoji = pct >= 80 ? "🏆" : pct >= 50 ? "👍" : "💪";

  // Group this round's misses by topic so we can tell him exactly what to
  // focus on and why — using the real explanation from the question he got
  // wrong, not just a generic "practice more" message.
  const missesByTopic = {};
  for(const r of roundResults){
    if(r.correct) continue;
    if(!missesByTopic[r.topicId]) missesByTopic[r.topicId] = { topicName:r.topicName, items:[] };
    missesByTopic[r.topicId].items.push(r);
  }
  const missTopics = Object.values(missesByTopic);
  const missTopicIds = Object.keys(missesByTopic);
  const leveledUpTopics = [...new Set(roundResults.filter(r=>r.leveledUp).map(r=>r.topicName))];

  let focusHTML = "";
  if(missTopics.length === 0){
    focusHTML = `<div class="summary-stat" style="border:none;"><span style="color:#16a34a; font-weight:600;">Perfect round — no gaps to flag. 🎉</span></div>`;
  } else {
    focusHTML = missTopics.map(m => `
      <div class="summary-stat" style="display:block;">
        <div class="topic-name">${m.topicName} <span style="color:#64748b; font-weight:400;">— missed ${m.items.length}</span></div>
        <div class="explain" style="margin-top:2px;">${m.items[0].explain}</div>
      </div>`).join("");
  }
  const levelUpHTML = leveledUpTopics.length
    ? `<p class="explain" style="margin-top:10px;">⬆ Leveled up this round in: <strong>${leveledUpTopics.join(", ")}</strong></p>`
    : "";

  // Year-advance celebration: only for subjects with yearForTier (math/english).
  // Compares the subject-wide year at round start vs now, so it only fires
  // when the WHOLE subject crosses into a new year, not just one topic.
  const yearAfterRound = subjectYear(currentSubject);
  const yearBannerHTML = (yearBeforeRound !== null && yearAfterRound !== null && yearAfterRound > yearBeforeRound)
    ? `<div class="year-banner">🎓 Amazing work — moving into Year ${yearAfterRound} for ${CURRICULUM[currentSubject].label}!</div>`
    : "";

  const bonusBtnHTML = (currentRoundMode === "normal" && missTopicIds.length > 0)
    ? `<button class="bonus-btn" onclick='startRound("${currentSubject}", ${JSON.stringify(missTopicIds)})'>🎯 Bonus round: focus on tricky topics</button>`
    : "";

  app.innerHTML = `
    <div class="card">
      <div class="big-emoji">${emoji}</div>
      <h1 style="text-align:center;">${correctCount} / ${total} correct</h1>
      <p class="subtitle" style="text-align:center;">${currentRoundMode==='bonus' ? 'Bonus round complete.' : CURRICULUM[currentSubject].label + ' round complete.'}</p>
      ${yearBannerHTML}
      ${levelUpHTML}
      <h1 style="font-size:1.05rem; margin-top:18px;">Focus on next time</h1>
      ${focusHTML}
      <p class="footer-note" style="margin-top:12px;">${missTopics.length ? "These stay at the same level until solid — use the bonus round below for focused extra practice." : ""}</p>
      ${bonusBtnHTML}
      <button class="next-btn" onclick="startRound('${currentSubject}')">Play another round</button>
      <button class="dashboard-btn" onclick="renderDashboard()">View progress</button>
      <button class="back-link" style="margin-top:10px;" onclick="renderHome()">Home</button>
    </div>`;
}

function renderDashboard(){
  const sections = Object.keys(CURRICULUM).map(subject=>{
    const cfg = CURRICULUM[subject];
    const year = subjectYear(subject);
    const summaryLine = year !== null
      ? `<p class="subject-summary">Currently working in: <strong>Year ${year}</strong></p>`
      : `<p class="subject-summary">Reading-based — depth grows as topics are mastered.</p>`;
    const rows = cfg.topics.map(t=>{
      const s = STATE[subject].topics[t.id];
      const acc = s.attempts ? Math.round((s.correct/s.attempts)*100) : null;
      const gapTag = s.needsReview ? ` <span style="color:#d97706; font-weight:700;">· gap</span>` : "";
      return `<div class="summary-stat">
        <span class="topic-name">${t.name}${gapTag}</span>
        <span><span class="tier-badge t${s.tier}">${cfg.tierLabels[s.tier]}</span> ${acc!==null?` · ${acc}%`:""}</span>
      </div>`;
    }).join("");
    return `<h1 style="font-size:1.1rem; margin-top:18px;">${cfg.icon} ${cfg.label}</h1>${summaryLine}${rows}`;
  }).join("");
  app.innerHTML = `
    <div class="card">
      <button class="back-link" onclick="renderHome()">Home</button>
      <h1>Progress</h1>
      <p class="subtitle">This is how the app tracks and closes gaps over time.</p>
      ${sections}
    </div>`;
}

// Expose functions used by inline onclick handlers
window.startRound = startRound;
window.answer = answer;
window.nextQuestion = nextQuestion;
window.acknowledgePrimer = acknowledgePrimer;
window.renderHome = renderHome;
window.renderDashboard = renderDashboard;

renderHome();

// Cross-device sync check: render immediately from local state (above) so
// the app is never blocked waiting on a network call, then — if sync is on
// — pull whatever's in the cloud and adopt it ONLY if it's actually newer
// than what's on this device. Whichever side (local or cloud) has the more
// recent `updatedAt` wins; the loser is overwritten to match, so both sides
// converge on one shared progress record instead of silently forking.
if(SYNC_ENABLED){
  cloudPull().then(cloudState => {
    if(!cloudState) return; // nothing saved in the cloud yet — this device's save will seed it
    const migrated = migrateState(cloudState);
    if((migrated.updatedAt || 0) > (STATE.updatedAt || 0)){
      STATE = migrated;
      saveStateLocalOnly(STATE);
      // Don't yank the screen out from under a round in progress — the
      // merged state is already saved locally, so it'll be reflected the
      // moment he returns to Home or the Dashboard.
      if(!currentRound) renderHome();
    } else if((STATE.updatedAt || 0) > (migrated.updatedAt || 0)){
      cloudSync(STATE); // this device is ahead — push it up so the cloud catches up
    }
  });
}
</script>
</body>
