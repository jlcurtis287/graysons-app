/* ---------------------------------------------------------------------
   1b. SKILL GRAPH (Math & English) — redesigned 2026-08-01 per JC.
   Replaces the old "topic progresses through 9 Year2->Year4 tiers" model.
   Every curriculum objective is now its OWN independently-masterable skill
   node with its own mastery/confidence/priority — Grayson can legitimately
   be ahead in one skill and behind in another within the same subject, and
   the tutor should never force every skill in a subject to march through
   the same Year in lockstep. `year` here is informational only (shown on
   the dashboard so a parent can sanity-check against school expectations)
   — it plays NO role in gating or scheduling. `prereqs` is the real
   structure: it's what foundational-importance / blocks-future-learning
   are computed from in the priority score (see skillPriorityScore).
   History is deliberately NOT part of this graph — its content is
   independent historical facts with no real prerequisite depth, so it
   stays on the original topic+primer model (CURRICULUM.history / the
   topic-tier engine further down) per JC's explicit choice (2026-08-01).
   --------------------------------------------------------------------- */
const SKILLS = {
  math: {

    // gated these, which let 2-4 lucky correct answers on addition alone

// Descendant count (how many other skills, directly or indirectly, list
// this skill as a prerequisite) — the "foundational importance" /
// "blocks future learning" input to the priority score. Computed once from
// the static graph, not per-call: the graph itself never changes at
// runtime, only mastery does.
const SKILL_DESCENDANTS = {};
(function computeSkillDescendants(){
  for(const subject of Object.keys(SKILLS)){
    SKILL_DESCENDANTS[subject] = {};
    const skills = SKILLS[subject];
    for(const id of Object.keys(skills)) SKILL_DESCENDANTS[subject][id] = 0;
    for(const id of Object.keys(skills)){
      // Walk every OTHER skill's prereq chain; if `id` appears anywhere in
      // it (direct or transitive), `id` gets credit for unlocking that skill.
      for(const otherId of Object.keys(skills)){
        if(otherId === id) continue;
        const seen = new Set(); const stack = [...skills[otherId].prereqs];
        let dependsOnId = false;
        while(stack.length){
          const p = stack.pop();
          if(seen.has(p)) continue; seen.add(p);
          if(p === id){ dependsOnId = true; break; }
          stack.push(...(skills[p]?.prereqs || []));
        }
        if(dependsOnId) SKILL_DESCENDANTS[subject][id]++;
      }
    }
  }
})();

/* ---------------------------------------------------------------------
   2. HELPERS
   --------------------------------------------------------------------- */
function randInt(min,max){ return Math.floor(Math.random()*(max-min+1))+min; }
function pick(arr){ return arr[randInt(0,arr.length-1)]; }
function shuffle(arr){ const a=[...arr]; for(let i=a.length-1;i>0;i--){const j=randInt(0,i);[a[i],a[j]]=[a[j],a[i]];} return a; }
// Builds a multiple-choice question from a correct value + distractor pool, returns {options, correctIndex}
function makeMCQ(correct, distractorPool, fmt=(x)=>String(x)){
  // For every question in this app, a negative number is never a sensible
  // answer (ages, totals, money, sides, faces, subtraction results, fractions
  // of an amount, etc. are always >= 0). Guard here once, centrally, rather
  // than in every generator, so a distractor formula like "correct-10" can
  // never accidentally offer "-1" as a multiple-choice option.
  const nonNegativeCorrect = typeof correct === "number" && correct >= 0;
  const pool = distractorPool.filter(d => fmt(d) !== fmt(correct) && !(nonNegativeCorrect && typeof d === "number" && d < 0));
  const chosen = [];
  while(chosen.length < 3 && pool.length){
    const idx = randInt(0,pool.length-1);
    const val = pool.splice(idx,1)[0];
    if(!chosen.some(c=>fmt(c)===fmt(val))) chosen.push(val);
  }
  // If the pool didn't have 3 distinct distractors (common for binary true/false-
  // style items), only pad with numeric neighbors when correct is actually a
  // number — never fabricate nonsense text options for string answers.
  if(typeof correct === "number"){
    let offset = 1;
    while(chosen.length < 3 && offset < 50){
      for(const sign of [1,-1]){
        if(chosen.length>=3) break;
        const filler = correct + sign*offset;
        if(!chosen.some(c=>fmt(c)===fmt(filler)) && fmt(filler)!==fmt(correct) && filler>=0){
          chosen.push(filler);
        }
      }
      offset++;
    }
  }
  const all = shuffle([correct, ...chosen]);
  return { options: all.map(fmt), correctIndex: all.findIndex(v=>fmt(v)===fmt(correct)) };
}
// Builds a fixed-content comprehension question (used by History): same
// shuffling/dedup behaviour as makeMCQ, but for hand-written fact strings
// rather than generated numbers.
function makeFactMCQ(correct, wrongs, explain, q){
  const {options, correctIndex} = makeMCQ(correct, wrongs, (x)=>String(x));
  return {q, options, correctIndex, explain};
}

// Correctly forms -ing / -ed verb endings, respecting the "drop the silent e"
// spelling rule (explore -> exploring/explored, not exploreing/exploreed).
// Plain string concatenation broke on any verb ending in a silent e.
function ingForm(v){
  if(/[^aeiou]e$/.test(v)) return v.slice(0,-1) + "ing"; // explore -> exploring
  return v + "ing";
}
function edForm(v){
  if(/[^aeiou]e$/.test(v)) return v + "d"; // explore -> explored
  return v + "ed";
}

// Short, plain-English definitions for grammar terms, appended to
// explanations so a 6-year-old learns what the WORD means, not just the
// answer to this one question.
const GLOSSARY = {
  "Noun": "a person, place, or thing",
  "Verb": "a doing or action word",
  "Adjective": "a word that describes something",
  "Adverb": "a word that describes how something is done",
  "Pronoun": "a word that stands in for a name, like he, she, or it",
  "Conjunction": "a joining word, like and, but, or because",
  "Preposition": "a word that shows where something is, like under or beside",
  "Proper noun": "the special name of a person or place, like Grayson or London",
  "Common noun": "a general name for a thing, not its own special name",
  "Complete sentence": "a full thought that makes sense on its own",
  "Sentence fragment": "a piece of a sentence that isn't a full thought yet",
  "Simple sentence": "a sentence with just one idea in it",
  "Compound sentence": "two ideas joined together, usually with a word like and or but",
  "Subordinate clause": "a part of a sentence that can't stand alone",
  "Progressive tense": "shows something happening right now",
  "Future tense": "shows something that hasn't happened yet, but will",
  "Present perfect tense": "shows something that has already happened",
  "Past tense": "shows something that already happened",
  "Past perfect tense": "shows something that had already happened before another past event",
};
function withDef(term){
  const def = GLOSSARY[term];
  return def ? ` (${term.toLowerCase()} = ${def})` : "";
}
// Builds a short "quick reminder" sentence introducing one or more grammar
// terms BEFORE the question is asked, not just after — so a 6-year-old has
// the concept in hand while he's thinking, not only once he's already
// answered. Terms not in GLOSSARY are silently skipped (safe to call with
// anything).
function introSentence(...terms){
  const known = terms.filter(t => GLOSSARY[t]);
  if(!known.length) return "";
  const sentences = known.map(t => `${t} is ${GLOSSARY[t]}.`);
  return `Quick reminder: ${sentences.join(" ")} `;
}

/* ---------------------------------------------------------------------
   3. QUESTION CONTENT
   - math / english: procedurally generated, unlimited variety.
   - history: fixed comprehension questions per topic, 4 per topic
     ordered easy -> harder (recall, recall, why, comprehension/inference).
   --------------------------------------------------------------------- */

G.math.fractions_on_number_line = [
  // Ordered easiest-first (JC, 2026-08-01 audit): reading a labeled mark
  // directly off N equal parts is a simple counting task; converting a
  // percentage to a fraction first (below) adds a genuine extra abstraction
  // step, so it now comes second even though both were originally written
  // in the reverse order.
  () => { const denom=pick([2,3,4]); const num=randInt(1,denom-1); const correct=`${num}/${denom}`;
    const wrongs=[`${num}/${denom+1}`,`${num+1}/${denom}`].filter(w=>w!==correct);
    const {options,correctIndex}=makeMCQ(correct,wrongs,(x)=>String(x));
    return {q:`A number line from 0 to 1 is split into ${denom} equal parts. Which fraction is at the ${num}${num===1?"st":num===2?"nd":num===3?"rd":"th"} mark after 0?`,
      options, correctIndex, explain:`${num} parts out of ${denom} equal parts = ${correct}.`}; },
  () => { const denom=pick([2,4]); const num=randInt(1,denom-1); const correct=`${num}/${denom}`;
    const posPct = Math.round((num/denom)*100);
    // Build wrongs from a pool of candidate fractions rather than a fixed
    // 2-item list — when denom=2, num is always 1, so both `${denom-num}/${denom}`
    // and `1/${denom}` collapse to the same string as correct ("1/2"), leaving
    // zero valid wrong options and crashing makeMCQ. Drawing from a larger,
    // deduped candidate pool guarantees at least 2 distinct wrongs regardless
    // of denom/num.
    const candidates = [];
    for(let n=1;n<denom;n++) if(n!==num) candidates.push(`${n}/${denom}`);
    candidates.push(`${num}/${denom===2?4:2}`, `${denom-num}/${denom+1}`, `1/${denom+1}`);
    const wrongs = [...new Set(candidates)].filter(w=>w!==correct).slice(0,2);
    const {options,correctIndex}=makeMCQ(correct,wrongs,(x)=>String(x));
    return {q:`A number line goes from 0 to 1. A mark sits ${posPct}% of the way along. Which fraction is that?`,
      options, correctIndex, explain:`${posPct}% of the way from 0 to 1 = ${correct}.`}; },
];

    if(!Array.isArray(existing.seenAtTier)) existing.seenAtTier = [];

    delete existing.readyForBonus;

      }

  for(const savedId of Object.keys(s.history.topics)){

  // ---- Math/English: flat skill-graph model (redesigned 2026-08-01) ----
  for(const subj of ["math","english"]){
    if(!s[subj]) s[subj] = {};
    if(!s[subj].skills) s[subj].skills = {};
    if(s[subj]._migratedToSkillGraph !== "v1"){
      // Old shape (pre-redesign) had s[subj].topics[topicId].concepts[tier].
      // Seed each new skill's prior from its source topic's REAL play data
      // (average mastery across that topic's touched tiers), not a blind
      // reset — the whole point of this redesign is a more accurate model,
      // not throwing away weeks of real evidence. Confidence is deliberately
      // kept modest even when inherited: the new skill is narrower than the
      // old topic it came from, so it hasn't truly been independently
      // assessed yet under the new, more granular model.
      const oldTopics = (s[subj].topics) || {};
      for(const skillId of Object.keys(SKILLS[subj])){
        if(s[subj].skills[skillId]) continue;
        const oldTopicId = SKILL_SOURCE_TOPIC[subj][skillId];
        const oldTopic = oldTopicId ? oldTopics[oldTopicId] : null;
        if(oldTopic && oldTopic.concepts && Object.keys(oldTopic.concepts).length){
          const concepts = Object.values(oldTopic.concepts);
          const totalAttempts = concepts.reduce((sum,c)=>sum+(c.attempts||0),0);
          if(totalAttempts > 0){
            const avgMastery = concepts.reduce((sum,c)=>sum+(c.mastery||0.1),0) / concepts.length;
            const seeded = defaultConceptState();
            seeded.mastery = avgMastery;
            seeded.confidence = Math.min(0.4, confidenceFromAttempts(totalAttempts) * 0.5);
            s[subj].skills[skillId] = seeded;
          }
        }
      }
      s[subj]._migratedToSkillGraph = "v1";
      delete s[subj].topics; // old shape retired — skills is now the source of truth
    }
    // Prune any saved skill no longer in SKILLS (future-proofing, same
    // pattern as History's topic pruning above).
    const validSkillIds = new Set(Object.keys(SKILLS[subj]));
    for(const savedId of Object.keys(s[subj].skills)){
      if(!validSkillIds.has(savedId)) delete s[subj].skills[savedId];
    }
  }

  if(s.updatedAt === undefined) s.updatedAt = 0;
  return s;
}
function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) return migrateState(JSON.parse(raw));
  }catch(e){}
  return defaultState();
}
function saveState(state){
  state.updatedAt = Date.now();
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  cloudSync(state); // no-op until Firebase is configured, see SYNC section
}
// Writes a state we just pulled FROM the cloud back into localStorage without
// re-triggering a cloud write (it already lives there) — keeps the two in
// sync without an infinite read/write ping-pong.
function saveStateLocalOnly(state){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

let STATE = loadState();

/* ---------------------------------------------------------------------
   5. ADAPTIVE ENGINE
   --------------------------------------------------------------------- */

// Once-per-round bookkeeping: topics NOT visited this round get "older"
// (roundsSince++), topics visited get reset to 0 ("just practiced"). This
// used to run per-answer, which over-counted multi-question topics (like
// History's primer-then-several-questions visits) and skewed rotation.
function bumpRoundCounters(subject, touchedTopicIds){
  const touched = new Set(touchedTopicIds);
  for(const t of CURRICULUM[subject].topics){
    const s = STATE[subject].topics[t.id];
    s.roundsSince = touched.has(t.id) ? 0 : s.roundsSince + 1;
  }
}

/* ---------------------------------------------------------------------
   5b. ADAPTIVE LEARNER MODEL — all three subjects
   Per the Adaptive Tutor Design Specification: mastery is never a one-time
   event. Every topic (Math, English, History alike) is broken into per-tier
   "concepts" (topicId+tier), each independently tracked across several
   axes: mastery (belief the underlying skill is learned), confidence (how
   much evidence backs that belief — deliberately separate from mastery),
   retrieval strength/forgetting risk (a decaying memory-freshness
   estimate), misconceptions (recurring wrong-answer patterns, Math only —
   see classifyMisconception), hint usage, response time, and a capped
   review history.

   Originally built as a Math-only pilot, then ported to English (identical
   content shape: procedurally-generated, tier-indexed generators) and
   History (different shape: a small FIXED pool of 6 comprehension
   questions per topic, 4 tiers instead of 9 — see questionForConceptTier's
   isReading branch and the History-specific hint/prerequisite handling).

   Architecture, mapped to the spec's named systems:
     - Knowledge Graph  -> SUBJECT_PREREQUISITES + prerequisitesReady()
     - Learner Model    -> defaultConceptState/bktUpdate/updateConcept
     - Review Engine    -> retrievalStrengthNow/forgettingRisk (spaced rep.)
     - Tutor Engine      -> topicPriorityScore/buildAdaptiveSession
     - Assessment Engine -> questionForConceptTier + the answerAdaptive UI fn
   Kept as plain functions over the existing STATE object (no framework/
   build step) so the app stays a single deployable static file.
   --------------------------------------------------------------------- */

// ---- Knowledge Graph: which topics lean on which others, per subject ----
// Used to avoid pushing a topic's next tier when a prerequisite is itself
// shaky — practicing "Fractions" tier 4 when "Place Value" is still weak
// just produces confused guessing, not learning. History's topics are
// independent historical facts/events with no real prerequisite structure,
// so it gets an empty map (no gating) rather than a forced hierarchy.
// Math/English used to have topic-level prerequisites here too, before the
// 2026-08-01 skill-graph redesign moved that structure onto individual
// skills (see SKILLS[subject][skillId].prereqs + skillPrereqsReady, section
// 5c) — far more granular than 8/6 broad topics. Only History still uses
// this topic-level map (and it's empty: independent facts, no gating).
const SUBJECT_PREREQUISITES = {
  math: {}, english: {}, history: {},
};

// ---- Bayesian Knowledge Tracing parameters ----
// pSlip: chance of a mistake despite having learned the skill.
// pGuess: chance of a correct answer despite NOT having learned it (a real
//   possibility with 4-option multiple choice).
// pTransit: chance any single attempt causes new learning to "stick".
// These are deliberately simple, fixed defaults rather than per-topic-tuned
// values — a reasonable starting point, and an obvious place to specialize
// later if particular topics prove to guess/slip at different rates.
const BKT = { pSlip: 0.10, pGuess: 0.25, pTransit: 0.15 };
const MS_PER_DAY = 86400000;

function defaultConceptState(){
  return {
    mastery: 0.1,        // P(learned), 0-1 — updated only by new evidence
    confidence: 0,       // evidence volume, 0-1 — independent of mastery
    stability: 1,        // memory "half-life" in days, grows with spaced success
    lastSeenAt: null,
    attempts: 0,
    correct: 0,
    hintUses: 0,
    responseTimes: [],   // capped rolling list, ms
    misconceptions: {},  // tag -> count
    seenTexts: [],        // capped anti-repeat memory, like the old seenAtTier
    reviewHistory: [],    // capped rolling list of {t, correct, hintUsed, responseTimeMs, misconception}
  };
}

// Standard BKT posterior update given one observed answer, then applies the
// "transit" chance of new learning. If a hint was used, the observation is
// blended halfway back toward the prior — a hinted correct answer is real
// but weaker evidence of UNAIDED mastery than an unhinted one.
function bktUpdate(mastery, wasCorrect, hintUsed){
  const {pSlip, pGuess, pTransit} = BKT;
  let posterior = wasCorrect
    ? (mastery*(1-pSlip)) / (mastery*(1-pSlip) + (1-mastery)*pGuess)
    : (mastery*pSlip) / (mastery*pSlip + (1-mastery)*(1-pGuess));
  if(hintUsed) posterior = (posterior + mastery) / 2;
  const updated = posterior + (1-posterior)*pTransit;
  return Math.min(0.99, Math.max(0.01, updated));
}

// Predicted probability of a correct answer right now, given mastery —
// used to target the 70-85% "productive struggle" zone (Zone of Proximal
// Development) rather than either trivial or frustrating content.
function predictedSuccess(concept){
  return concept.mastery*(1-BKT.pSlip) + (1-concept.mastery)*BKT.pGuess;
}

// How fresh this concept's memory is right now (1 = just practiced, decaying
// toward 0 the longer it's been). Deliberately NOT folded into `mastery`
// itself — mastery is a belief that only changes on new evidence; retrieval
// strength is a separate, purely time-based axis that drives what resurfaces
// for review. A concept can be well-mastered AND overdue for review at once.
function retrievalStrengthNow(concept, now){
  now = now || Date.now();
  if(!concept.lastSeenAt) return 0;
  const daysSince = (now - concept.lastSeenAt) / MS_PER_DAY;
  return Math.exp(-daysSince / Math.max(concept.stability, 0.5));
}
function forgettingRisk(concept, now){
  return 1 - retrievalStrengthNow(concept, now);
}
// Successfully recalling something after a longer gap is stronger evidence
// of durable learning than instant re-drill, so it grows stability faster.
// A miss resets stability sharply (durable memory needs re-establishing).
function updateStability(concept, wasCorrect, now){
  const daysSince = concept.lastSeenAt ? (now - concept.lastSeenAt) / MS_PER_DAY : 0;
  if(wasCorrect){
    const gapBonus = Math.min(2.5, 1 + daysSince);
    concept.stability = Math.min(60, concept.stability * gapBonus);
  } else {
    concept.stability = Math.max(0.5, concept.stability * 0.5);
  }
}

// Evidence-volume confidence: how MUCH we know, not how WELL he's doing.
// Saturates toward 1 as attempts accumulate; deliberately does not consider
// correctness at all, so mastery and confidence can never be conflated (a
// couple of lucky guesses raises mastery slightly, per BKT, but confidence
// stays low until there's a real track record).
function confidenceFromAttempts(attempts){
  const K = 8; // ~0.5 confidence after 8 attempts at this concept
  return attempts / (attempts + K);
}

// Heuristic misconception tagging. Works purely off the numbers involved
// (no per-generator authoring needed), so it's necessarily limited — it can
// spot "off by ten/hundred" (place-value slips) and "off by one" (counting
// slips) patterns, but can't yet detect true operation-confusion (e.g.
// subtracted instead of added) without generators exposing their operands,
// which none currently do. Flagged here as a known limitation, not silently
// pretended away.
function classifyMisconception(correctVal, chosenVal){
  const cNum = parseFloat(String(correctVal).replace(/[^0-9.\-]/g,""));
  const xNum = parseFloat(String(chosenVal).replace(/[^0-9.\-]/g,""));
  if(isNaN(cNum) || isNaN(xNum)) return "conceptual";
  const diff = xNum - cNum;
  if(Math.abs(diff) === 100) return "place-value (off by hundred)";
  if(Math.abs(diff) === 10) return "place-value (off by ten)";
  if(Math.abs(diff) === 1) return "off-by-one (counting slip)";
  return "conceptual";
}

// Resolves the concept object being updated. History passes a real tier
// (topic+tier model); Math/English pass tier undefined/null (flat skill
// model) — this is the one place that difference is reconciled, so the
// rest of the answer-recording logic (and the UI layer above it) can stay
// completely shared between the two shapes.
function conceptFor(subject, id, tier){
  if(tier === undefined || tier === null){
    if(!STATE[subject].skills[id]) STATE[subject].skills[id] = defaultConceptState();
    return STATE[subject].skills[id];
  }
  const topicState = STATE[subject].topics[id];
  if(!topicState.concepts[tier]) topicState.concepts[tier] = defaultConceptState();
  return topicState.concepts[tier];
}
// The single entry point that records one answer's worth of evidence for a
// concept (History topic+tier, or Math/English skill), updating every axis
// at once, then persists (and syncs).
function updateConcept(subject, id, tier, {wasCorrect, hintUsed, responseTimeMs, misconceptionTag}){
  const c = conceptFor(subject, id, tier);
  const now = Date.now();
  updateStability(c, wasCorrect, now);
  c.mastery = bktUpdate(c.mastery, wasCorrect, hintUsed);
  c.attempts++;
  if(wasCorrect) c.correct++;
  if(hintUsed) c.hintUses++;
  c.lastSeenAt = now;
  c.confidence = confidenceFromAttempts(c.attempts);
  if(responseTimeMs != null){
    c.responseTimes.push(responseTimeMs);
    if(c.responseTimes.length > 20) c.responseTimes.shift();
  }
  if(!wasCorrect && misconceptionTag){
    c.misconceptions[misconceptionTag] = (c.misconceptions[misconceptionTag]||0) + 1;
  }
  c.reviewHistory.push({t:now, correct:wasCorrect, hintUsed:!!hintUsed, responseTimeMs:responseTimeMs||null, misconception:misconceptionTag||null});
  if(c.reviewHistory.length > 50) c.reviewHistory.shift();
  if(tier !== undefined && tier !== null){
    // Legacy attempts/correct counters on the topic wrapper — History only,
    // kept numerically sane for anything still reading them.
    const topicState = STATE[subject].topics[id];
    topicState.attempts++;
    if(wasCorrect) topicState.correct++;
  }
  saveState(STATE);
  return c;
}

function masteryAtTier(subject, topicId, tier){
  const c = STATE[subject].topics[topicId].concepts[tier];
  return c ? c.mastery : 0.1;
}
// The tier displayed as "current level" — the first tier, scanning up from
// 0, that ISN'T yet solidly mastered (mastery >= 0.8). Deliberately computed
// fresh every time rather than stored as its own counter, so it can only
// ever reflect actual evidence in the concept model — no separate "tier"
// value to drift out of sync with the mastery data behind it.
function currentDisplayTier(subject, topicId){
  // tierLabels.length works uniformly across the 9-tier Math/English scale
  // and History's 4-tier depth scale — yearForTier only exists for
  // Math/English (it's just the Year-label lookup, orthogonal to tier count).
  const maxTier = CURRICULUM[subject].tierLabels.length - 1;
  let tier = 0;
  while(tier < maxTier && masteryAtTier(subject, topicId, tier) >= 0.8) tier++;
  return tier;
}
function prerequisitesReady(subject, topicId){
  const prereqs = (SUBJECT_PREREQUISITES[subject] || {})[topicId] || [];
  return prereqs.every(pId => masteryAtTier(subject, pId, currentDisplayTier(subject, pId)) >= 0.5);
}

// ---- Review Engine + Tutor Engine ----
const ZPD_TARGET = 0.775;        // aim for the middle of a 70-85% success band
const REVIEW_DUE_THRESHOLD = 0.6; // retrieval strength below this = due for review
const ADAPTIVE_SESSION_LENGTH = 10;
const MAX_CONSECUTIVE_SAME_TOPIC = 2;
// Per JC: topics he's behind on (relative to his OWN most-advanced Math
// topic) should get more question time than topics he's already ahead in —
// closing gaps takes priority over racing ahead on his strongest topic.
// Weight is per tier of gap behind the frontier; capped implicitly since
// tier gaps max out at 8 (the tier ceiling).
const CATCH_UP_WEIGHT = 0.18;

function frontierTier(subject){
  return Math.max(...CURRICULUM[subject].topics.map(t => currentDisplayTier(subject, t.id)));
}

// Combines: how overdue for review (spaced repetition), how close to the
// ZPD sweet spot (neither trivial nor frustrating), a catch-up bonus for
// topics lagging behind his own most-advanced Math topic, a small staleness
// bonus so every topic still gets covered eventually, and a penalty if a
// prerequisite topic isn't ready yet (Knowledge Graph gate). Note: this
// scores how attractive a topic is on its own merits — it does NOT decide
// focus-mode selection. A flat "focus bonus" here used to just nudge the
// odds in a multi-way weighted draw, which wasn't enough to make "Focus on
// this" feel focused; that's now handled by direct slot reservation in
// buildAdaptiveSession instead (see FOCUS_SLOT_RATIO).
function topicPriorityScore(subject, topicId, frontier){
  const activeTier = currentDisplayTier(subject, topicId);
  const concept = STATE[subject].topics[topicId].concepts[activeTier] || defaultConceptState();
  const rs = retrievalStrengthNow(concept);
  const dueScore = Math.max(0, REVIEW_DUE_THRESHOLD - rs) * 2;
  const predicted = predictedSuccess(concept);
  const zpdScore = 1 - Math.min(1, Math.abs(predicted - ZPD_TARGET) / 0.3);
  const readinessPenalty = prerequisitesReady(subject, topicId) ? 0 : 0.6;
  const stalenessBonus = Math.min(0.3, (STATE[subject].topics[topicId].roundsSince||0) * 0.05);
  const catchUpBonus = frontier != null ? Math.max(0, frontier - activeTier) * CATCH_UP_WEIGHT : 0;
  return Math.max(0.05, dueScore + zpdScore + stalenessBonus + catchUpBonus - readinessPenalty);
}

function questionForConceptTier(subject, topicId, tier, usedTexts){
  const topicState = STATE[subject].topics[topicId];
  if(!topicState.concepts[tier]) topicState.concepts[tier] = defaultConceptState();
  const concept = topicState.concepts[tier];
  const gens = G[subject][topicId];
  const seen = new Set(concept.seenTexts || []);

  if(CURRICULUM[subject].isReading){
    // History: a small FIXED pool of 6 comprehension questions per topic,
    // not tier-indexed generator functions. Higher tiers unlock more of the
    // pool (3 at tier0, up to all 6 at tier3) rather than harder content —
    // depth of coverage grows instead of difficulty. Prefer whichever
    // haven't been shown yet (seenTexts), same anti-repeat idea as
    // Math/English, falling back to a repeat only once the eligible subset
    // is exhausted within this session.
    const unlockCount = Math.min(tier + 3, gens.length);
    const all = gens.map((fn, idx) => ({ idx, q: fn() }));
    const fresh = all.filter(c => !seen.has(c.q.q));
    const eligible = [...fresh, ...all.filter(c => seen.has(c.q.q))].slice(0, unlockCount);
    const notUsedThisSession = eligible.filter(c => !usedTexts.has(c.q.q));
    const pool = notUsedThisSession.length ? notUsedThisSession : eligible;
    const chosen = pool[randInt(0, pool.length-1)];
    usedTexts.add(chosen.q.q);
    if(!concept.seenTexts.includes(chosen.q.q)) concept.seenTexts.push(chosen.q.q);
    if(concept.seenTexts.length > gens.length) concept.seenTexts.shift();
    return { topicId, tier, ...chosen.q };
  }

  // Math/English: procedurally generated, tier-indexed generator functions —
  // retry on a collision with (a) a question already used elsewhere in THIS
  // session, or (b) one already seen at this exact tier in a PREVIOUS
  // attempt (concept.seenTexts), up to a generous retry budget (60) so thin
  // content pools still get a fair chance to find something fresh.
  let q, attempts = 0;
  do { q = gens[Math.min(tier, gens.length-1)](); attempts++; }
  while((usedTexts.has(q.q) || seen.has(q.q)) && attempts < 60);
  usedTexts.add(q.q);
  if(!concept.seenTexts.includes(q.q)) concept.seenTexts.push(q.q);
  if(concept.seenTexts.length > 40) concept.seenTexts.shift();
  return { topicId, tier, ...q };
}

// Builds one interleaved, adaptive session for History (the only subject
// still on this topic+tier engine — Math/English moved to buildSkillSession,
// see section 5c). Two modes:
//
// FREE mode (no focusTopicId — "Practice History"): each of the 10 slots
// re-scores every topic (so priorities can shift mid-session), then picks a
// weighted-random topic from the top few candidates — never fully greedy
// (sessions would feel robotic) and never allowing more than
// MAX_CONSECUTIVE_SAME_TOPIC in a row (interleaving, per the spec's "mixed
// practice over blocked practice" principle).
//
// FOCUS mode ("Focus on this topic"): a flat scoring bonus alone wasn't
// enough — with several other topics also scoring reasonably (due for
// review, behind on catch-up, etc.), the chosen topic would only win a
// three-way weighted draw about half the time, which doesn't match what
// "Focus on this" promises. Focus mode instead reserves a large majority of
// slots (FOCUS_SLOT_RATIO) directly for the chosen topic, in blocks of up
// to FOCUS_MAX_RUN questions with brief interleaved breaks for retention —
// blocked deliberate practice with periodic retrieval checks, rather than a
// three-way split that barely reads as "focused" at all.
//
// Attaches the topic's primer to the FIRST question of that topic to appear
// in the session (not every occurrence), same "read it once per visit" idea
// as the old buildHistoryRound.
const FOCUS_SLOT_RATIO = 0.8; // e.g. 8 of 10 slots go to the focus topic
const FOCUS_MAX_RUN = 4;      // longest uninterrupted block before a breather question
function buildAdaptiveSession(subject, focusTopicId){
  const topics = CURRICULUM[subject].topics.map(t=>t.id);
  const usedTexts = new Set();
  const out = [];
  const primerShown = new Set();
  let lastTopic = null, lastTopicStreak = 0;
  // Computed once per session build, not per slot: tiers don't move mid-build
  // (they only change once an answer is actually recorded), so re-deriving
  // this on every one of the 10 picks would just be wasted work.
  const frontier = frontierTier(subject);
  const focusSlotCap = Math.round(ADAPTIVE_SESSION_LENGTH * FOCUS_SLOT_RATIO);
  const maxRun = focusTopicId ? FOCUS_MAX_RUN : MAX_CONSECUTIVE_SAME_TOPIC;
  for(let i=0;i<ADAPTIVE_SESSION_LENGTH;i++){
    let chosenId;
    const focusCountSoFar = out.filter(q=>q.topicId===focusTopicId).length;
    const focusDue = focusTopicId
      && focusCountSoFar < focusSlotCap
      && (lastTopic !== focusTopicId || lastTopicStreak < maxRun);
    if(focusDue){
      chosenId = focusTopicId;
    } else {
      let scored = topics.map(id => ({id, score: topicPriorityScore(subject, id, frontier)}));
      if(focusTopicId) scored = scored.filter(s => s.id !== focusTopicId); // non-focus slots interleave OTHER topics
      if(lastTopic && lastTopicStreak >= maxRun){
        scored = scored.filter(s => s.id !== lastTopic);
      }
      scored.sort((a,b)=>b.score-a.score);
      const pool = scored.slice(0, 3);
      const totalWeight = pool.reduce((sum,s)=>sum+s.score, 0);
      let r = Math.random()*totalWeight;
      chosenId = pool[0].id;
      for(const s of pool){ r -= s.score; if(r<=0){ chosenId = s.id; break; } }
    }
    const activeTier = currentDisplayTier(subject, chosenId);
    const q = questionForConceptTier(subject, chosenId, activeTier, usedTexts);
    if(CURRICULUM[subject].isReading && !primerShown.has(chosenId)){
      const topicDef = CURRICULUM[subject].topics.find(t=>t.id===chosenId);
      q.primer = topicDef.primer;
      primerShown.add(chosenId);
    }
    out.push(q);
    if(chosenId === lastTopic) lastTopicStreak++; else { lastTopic = chosenId; lastTopicStreak = 1; }
  }
  bumpRoundCounters(subject, [...new Set(out.map(q=>q.topicId))]);
  return out;
}

/* ---------------------------------------------------------------------
   5c. SKILL-GRAPH TUTOR ENGINE (Math & English only) — redesigned
   2026-08-01 per JC. Replaces topicPriorityScore/buildAdaptiveSession for
   these two subjects with something that behaves like a one-to-one tutor
   rather than a curriculum app: every skill has its own mastery/confidence,
   Grayson can legitimately be ahead in one skill and behind in another
   within the same subject, and — the key change — session TIME is
   allocated by a Priority Score built from nine factors (not just "low
   mastery"), then spent according to a 60-70/20-30/10-20 split across
   repairing foundational gaps, maintaining/stretching strengths, and
   spaced review. History is untouched — it stays on the topic+tier engine
   above, since its content is independent facts with no real skill graph.
   --------------------------------------------------------------------- */
function skillMastery(subject, skillId){
  const c = STATE[subject].skills[skillId];
  return c ? c.mastery : 0.1;
}
function skillConfidence(subject, skillId){
  const c = STATE[subject].skills[skillId];
  return c ? c.confidence : 0;
}
// A skill's own prerequisites are all solidly there: mastery >= 0.5 AND
// enough real evidence behind that estimate (confidence >= 0.4, which under
// confidenceFromAttempts' n/(n+8) curve takes roughly 5-6 real attempts to
// reach regardless of how many were correct). JC, 2026-08-02: mastery alone
// let a single lucky answer on a foundational skill "unlock" its harder
// dependent -- e.g. Division Facts crossed 0.5 mastery off ONE attempt,
// which immediately made Division with Remainders eligible even though
// Division Facts itself had barely been practiced under the new atomic
// model. Requiring real evidence too closes that gap generally, across the
// whole graph (multiplication -> 2-digit multiplication -> large numbers,
// rounding chains, fractions, sentence-structure chains, etc.), not just
// the addition/subtraction case fixed earlier.
function skillPrereqsReady(subject, skillId){
  const prereqs = (SKILLS[subject][skillId] && SKILLS[subject][skillId].prereqs) || [];
  return prereqs.every(pId => skillMastery(subject, pId) >= 0.5 && skillConfidence(subject, pId) >= 0.4);
}
// Direct dependents currently gated BECAUSE this skill isn't solid yet — a
// more immediate, concrete signal than the broader descendant count below
// ("blocks future learning right now" vs "is foundational in general").
// Must match skillPrereqsReady's own definition of "solid" (mastery AND
// confidence) -- otherwise a skill gating a dependent purely on thin
// evidence (high mastery, low confidence) would silently miss the "blocks
// other skills" priority bonus and dashboard explanation, even though it's
// the exact thing actually holding up a dependent skill right now.
function skillBlocksSomethingNow(subject, skillId){
  const skills = SKILLS[subject];
  const isSolid = skillMastery(subject, skillId) >= 0.5 && skillConfidence(subject, skillId) >= 0.4;
  return Object.keys(skills).some(otherId => {
    const prereqs = skills[otherId].prereqs || [];
    return prereqs.includes(skillId) && !isSolid;
  });
}
// Slope of recent correctness, -1..1: compares the newer half of the last
// 8 attempts against the older half, so a couple of lucky/unlucky guesses
// can't swing it. 0 if there isn't enough evidence yet to claim a trend.
function learningTrend(concept){
  const hist = (concept.reviewHistory || []).slice(-8);
  if(hist.length < 4) return 0;
  const mid = Math.floor(hist.length/2);
  const rate = (arr) => arr.filter(h=>h.correct).length / arr.length;
  return rate(hist.slice(mid)) - rate(hist.slice(0, mid));
}
const MAX_SKILL_DESCENDANTS = {
  math: Math.max(1, ...Object.values(SKILL_DESCENDANTS.math)),
  english: Math.max(1, ...Object.values(SKILL_DESCENDANTS.english)),
};
// The Priority Score (JC, 2026-08-01): "Priority should not simply equal
// low mastery." Blends nine signals — foundational importance (how many
// other skills descend from this one), current mastery, confidence in that
// mastery estimate, presence of misconceptions, forgetting risk, whether
// this skill is blocking a dependent RIGHT NOW, the expected impact of
// improving it (headroom × how much it unlocks), and the recent learning
// trend (already-improving skills ease off slightly; slipping ones get
// urgency). This is what decides how session time gets allocated — see
// buildSkillSession's 60-70/20-30/10-20 split.
function skillPriorityScore(subject, skillId){
  const concept = STATE[subject].skills[skillId] || defaultConceptState();
  const mastery = concept.mastery;
  const confidence = concept.confidence;
  const forgetting = 1 - retrievalStrengthNow(concept);
  const misconceptionCount = Object.values(concept.misconceptions || {}).reduce((a,b)=>a+b,0);
  const trend = learningTrend(concept);
  const descendants = SKILL_DESCENDANTS[subject][skillId] || 0;
  const foundationalImportance = descendants / MAX_SKILL_DESCENDANTS[subject]; // 0..1
  const blocksNow = skillBlocksSomethingNow(subject, skillId);
  const neverAttempted = concept.lastSeenAt == null;

  const masteryGapScore    = (1 - mastery);                              // headroom
  const confidenceBonus    = (1 - confidence) * 0.3;                     // estimate still uncertain
  const misconceptionBonus = Math.min(0.6, misconceptionCount * 0.2);    // repair urgency
  const forgettingBonus    = forgetting * 0.8;                           // overdue for review
  const foundationalBonus  = foundationalImportance * 0.9;               // unlocks a lot
  const blocksBonus        = blocksNow ? 0.7 : 0;                        // literally gating something now
  const impactBonus        = masteryGapScore * foundationalImportance * 0.6; // headroom x reach
  const trendAdjustment    = trend > 0.3 ? -0.2 : (trend < -0.3 ? 0.3 : 0); // easing off vs urgency
  const freshnessBonus     = neverAttempted ? 0.25 : 0;                  // don't let untouched skills hide forever

  return Math.max(0.05, masteryGapScore*0.5 + confidenceBonus + misconceptionBonus +
    forgettingBonus + foundationalBonus + blocksBonus + impactBonus + trendAdjustment + freshnessBonus);
}
// Human-readable reason a skill was picked, used by the dashboard so a
// parent can see WHY today's session looked the way it did, not just what
// the numbers are. Picks the single most influential factor.
function skillPriorityReason(subject, skillId){
  const concept = STATE[subject].skills[skillId] || defaultConceptState();
  if(concept.lastSeenAt == null) return "not attempted yet";
  const forgetting = 1 - retrievalStrengthNow(concept);
  const misconceptionCount = Object.values(concept.misconceptions || {}).reduce((a,b)=>a+b,0);
  const blocksNow = skillBlocksSomethingNow(subject, skillId);
  const descendants = SKILL_DESCENDANTS[subject][skillId] || 0;
  const trend = learningTrend(concept);
  if(blocksNow) return "blocking other skills that depend on it";
  if(misconceptionCount >= 2) return "a repeated misconception needs correcting";
  if(trend < -0.3) return "recent answers are trending down";
  if(forgetting > 0.6) return "overdue for review — memory is fading";
  if(descendants >= 3 && concept.mastery < 0.6) return "foundational — a lot depends on this one";
  if(concept.mastery >= 0.8) return "strong — light maintenance to keep it sharp";
  return "building toward mastery";
}

// JC, 2026-08-01: a skill's generator array is authored in easy-to-hard
// order (index 0 = simplest phrasing/numbers, last index = hardest) -- but
// questionForSkill used to draw uniformly at random across ALL of them
// regardless of mastery, so a skill's very first-ever question could roll
// its hardest variant (e.g. Telling Time's 24-hour-clock conversion showing
// up before "It's 3 o'clock, what time is it?"). This weights the draw
// toward whichever generator matches current mastery, without ever fully
// ruling any generator out -- a low-mastery skill mostly sees easy
// questions with an occasional stretch question, and a well-practiced skill
// mostly sees hard ones but still gets occasional easy review questions
// (real review pulls a skill in at ANY mastery level, so easy questions
// should stay reachable even once a skill is strong).
function pickGeneratorIndex(gens, mastery){
  const n = gens.length;
  if(n <= 1) return 0;
  const idealIdx = mastery * (n - 1); // 0 (easiest) .. n-1 (hardest)
  const weights = gens.map((_, i) => Math.max(0.05, 1 - Math.abs(i - idealIdx) / n));
  const total = weights.reduce((a, b) => a + b, 0);
  let r = Math.random() * total;
  for(let i = 0; i < n; i++){ r -= weights[i]; if(r <= 0) return i; }
  return n - 1;
}
function questionForSkill(subject, skillId, usedTexts){
  if(!STATE[subject].skills[skillId]) STATE[subject].skills[skillId] = defaultConceptState();
  const concept = STATE[subject].skills[skillId];
  const gens = G[subject][skillId];
  const seen = new Set(concept.seenTexts || []);
  // "pool" skills (currently just the two Reading Comprehension skills) map
  // each array index to a different fixed PASSAGE, not a difficulty level --
  // mastery-weighted selection would wrongly bias which STORY comes up
  // instead of picking between them evenly, so those stay uniform random.
  const isPool = !!(SKILLS[subject][skillId] && SKILLS[subject][skillId].pool);
  let q, attempts = 0;
  do { q = gens[isPool ? randInt(0, gens.length-1) : pickGeneratorIndex(gens, concept.mastery)](); attempts++; }
  while((usedTexts.has(q.q) || seen.has(q.q)) && attempts < 60);
  usedTexts.add(q.q);
  if(!concept.seenTexts.includes(q.q)) concept.seenTexts.push(q.q);
  if(concept.seenTexts.length > 40) concept.seenTexts.shift();
  // topicId alias: lets the shared UI/updateConcept layer treat a skill
  // exactly like a tier-less "topic" (tier stays undefined), so History's
  // and Math/English's question objects can flow through the same render/
  // answer code paths without a subject-by-subject UI fork everywhere.
  return { topicId: skillId, skillId, ...q };
}

const SKILL_SESSION_LENGTH = 10;
// JC's bands: 60-70% repair, 20-30% maintain, 10-20% review. Review's slot
// count is reserved FIRST (as a floor), then repair/maintain split the
// remainder proportionally — reserving repair and maintain independently
// via two separate Math.round() calls let their sums swallow 100% of a
// 10-slot session (7+3=10) with nothing left for review, which silently
// violated the 10-20% floor. Reserving review first guarantees it always
// gets a real, non-zero share, matching what JC actually asked for: some
// spaced retrieval every session, not "whenever there happen to be leftover
// slots."
const REPAIR_SHARE = 0.65, MAINTAIN_SHARE = 0.25, REVIEW_SHARE = 0.15; // midpoints of 60-70/20-30/10-20
const SKILL_FOCUS_SLOT_RATIO = 0.8;
const SKILL_FOCUS_MAX_RUN = 4;
const MAX_CONSECUTIVE_SAME_SKILL = 2;

// Weighted-random pick from the top-3 of a scored list — same "never fully
// greedy, but not a flat lottery either" shape used throughout this app.
function weightedPickTop3(scored){
  const pool = scored.slice(0, 3);
  const totalWeight = pool.reduce((sum,s)=>sum+s.score, 0);
  let r = Math.random()*totalWeight;
  let chosen = pool[0].id;
  for(const s of pool){ r -= s.score; if(r<=0){ chosen = s.id; break; } }
  return chosen;
}

// Builds one 10-question session for Math or English. FREE mode allocates
// slots across three buckets by Priority Score (repair/maintain/review);
// FOCUS mode (a specific skill picked from the hub) reserves 80% of slots
// for that skill, same "blocked practice with breathers" shape as History's
// focus mode, with the rest still drawn from the normal three-bucket blend
// so focusing on one skill doesn't mean total tunnel vision.
function buildSkillSession(subject, focusSkillId){
  const allIds = Object.keys(SKILLS[subject]);
  const usedTexts = new Set();
  const out = [];
  let lastId = null, lastStreak = 0;
  const primerShown = new Set(); // keyed by qtag (passage title), for reading skills

  const focusSlotCap = focusSkillId ? Math.round(SKILL_SESSION_LENGTH * SKILL_FOCUS_SLOT_RATIO) : 0;
  const maxRun = focusSkillId ? SKILL_FOCUS_MAX_RUN : MAX_CONSECUTIVE_SAME_SKILL;

  for(let i=0; i<SKILL_SESSION_LENGTH; i++){
    let chosenId;
    const focusCountSoFar = out.filter(q=>q.skillId===focusSkillId).length;
    const focusDue = focusSkillId && focusCountSoFar < focusSlotCap && (lastId !== focusSkillId || lastStreak < maxRun);
    if(focusDue){
      chosenId = focusSkillId;
    } else {
      let candidates = allIds.filter(id => id !== focusSkillId);
      if(lastId && lastStreak >= maxRun) candidates = candidates.filter(id => id !== lastId);
      // Three buckets, scored the same way (skillPriorityScore) but drawn
      // from different eligible pools — this is what turns the priority
      // score into an actual 60/20/10-ish time allocation rather than just
      // a ranking.
      const repairEligible = candidates.filter(id => skillPrereqsReady(subject, id) && skillMastery(subject,id) < 0.8);
      const maintainEligible = candidates.filter(id => skillMastery(subject,id) >= 0.7);
      // Review = "spaced retrieval across PREVIOUSLY LEARNED concepts" (JC's
      // spec) — it must never be the bucket that introduces something
      // foundation-less. Unfiltered `candidates` let a skill whose
      // prerequisites aren't ready yet (e.g. Perimeter, before Addition is
      // solid) get pulled in here once the small repair pool was exhausted
      // for the session — exactly the "starting without a foundation"
      // problem JC flagged. Gate on both prereq-readiness AND actually
      // having been attempted before (lastSeenAt set); a skill that's ready
      // but has never been touched belongs in repair (first exposure), not
      // review (nothing to retrieve yet).
      const reviewEligible = candidates.filter(id => skillPrereqsReady(subject, id) &&
        STATE[subject].skills[id] && STATE[subject].skills[id].lastSeenAt != null);

      const repairSoFar = out.filter(q => q.bucket==="repair").length;
      const maintainSoFar = out.filter(q => q.bucket==="maintain").length;
      // Review's slot count is reserved FIRST as a floor, then repair/maintain
      // split whatever remains proportionally. Rounding repair and maintain
      // independently (old code) let their sums swallow the whole session
      // (7+3=10) and starve review to 0% — see the comment on REVIEW_SHARE.
      const slotsReview = Math.max(1, Math.round(SKILL_SESSION_LENGTH*REVIEW_SHARE));
      const slotsRemaining = SKILL_SESSION_LENGTH - slotsReview;
      const slotsRepair = Math.round(slotsRemaining * (REPAIR_SHARE/(REPAIR_SHARE+MAINTAIN_SHARE)));
      const slotsMaintain = slotsRemaining - slotsRepair;

      let bucket, pool;
      if(repairSoFar < slotsRepair && repairEligible.length){
        bucket = "repair"; pool = repairEligible;
      } else if(maintainSoFar < slotsMaintain && maintainEligible.length){
        bucket = "maintain"; pool = maintainEligible;
      } else {
        // Fall back to MORE foundation-ready repair content, never to the
        // raw unfiltered catalog — on day 1 (nothing has been attempted
        // yet) reviewEligible is legitimately empty every single session,
        // and falling back to `allIds` there would silently reintroduce the
        // exact bug this gate exists to prevent. repairEligible is always
        // prereq-gated, so it's the safe fallback; allIds is the last
        // resort only if the graph is somehow fully exhausted.
        bucket = "review";
        pool = reviewEligible.length ? reviewEligible : (repairEligible.length ? repairEligible : allIds);
      }
      const scored = pool.map(id => ({id, score: skillPriorityScore(subject, id)}))
                          .sort((a,b)=>b.score-a.score);
      chosenId = weightedPickTop3(scored);
      var chosenBucket = bucket;
    }
    const q = questionForSkill(subject, chosenId, usedTexts);
    q.bucket = focusDue ? "focus" : chosenBucket;
    if(SKILLS[subject][chosenId].pool && q.qtag && !primerShown.has(q.qtag)){
      // Reading skills carry their own primer/qtag per question (see
      // G.english.reading_literal/reading_inference) — show it once per
      // passage per session, same idea as History's primer-once behavior.
      primerShown.add(q.qtag);
    } else if(SKILLS[subject][chosenId].pool){
      delete q.primer; // already shown this passage earlier in the session
    }
    out.push(q);
    if(chosenId === lastId) lastStreak++; else { lastId = chosenId; lastStreak = 1; }
  }
  return out;
}

// Adaptive hub for ANY subject (Math, English, History): a primary
// Tutor-Engine-driven "Practice X" session that interleaves whatever's due
// for review, in the right challenge zone, or behind on catch-up — plus a
// per-topic "Focus on this" option kept for agency/navigation (useful with a
// 6-year-old who likes to choose what he's working on) without abandoning
// interleaving entirely (see buildAdaptiveSession's focusTopicId handling).
// Generic "what do we call this thing" helper — History identifies by
// topicId (CURRICULUM.history.topics), Math/English by skillId (SKILLS).
// Centralizing this is what lets renderPrimer/renderAdaptiveQuestion/
// answerAdaptive stay shared across both models instead of forking.
function labelFor(subject, id){
  if(subject === "history") return CURRICULUM.history.topics.find(t=>t.id===id).name;
  return (SKILLS[subject][id] && SKILLS[subject][id].label) || id;
}

function renderSubjectHub(subject){
  const cfg = CURRICULUM[subject];
  if(subject === "history"){
    const frontier = frontierTier(subject);
    const rows = cfg.topics.map(t=>{
      const tier = currentDisplayTier(subject, t.id);
      const concept = STATE[subject].topics[t.id].concepts[tier] || defaultConceptState();
      const rs = Math.round(retrievalStrengthNow(concept)*100);
      const masteryPct = Math.round(concept.mastery*100);
      const dueTag = rs < REVIEW_DUE_THRESHOLD*100 && concept.lastSeenAt
        ? ` <span style="color:#d97706; font-weight:700;">· due for review</span>` : "";
      const behindTag = tier < frontier
        ? ` <span style="color:#2563eb; font-weight:700;">· catching up</span>` : "";
      return `<div class="summary-stat" style="display:block;">
        <div style="display:flex; justify-content:space-between; align-items:center;">

          <span class="tier-badge t${tier % 4}">${cfg.tierLabels[tier]}</span>
        </div>
        <div class="explain">Mastery ${masteryPct}% · memory freshness ${concept.lastSeenAt ? rs+"%" : "not started"}</div>
        <button class="dashboard-btn" style="margin-top:8px;" onclick="startAdaptiveSession('${subject}','${t.id}')">Focus on this</button>

    }).join("");

        ${rows}
      </div>`;
    return;
  }
  // Math/English: skill-graph hub. Skills are sorted by Priority Score so
  // the ones the tutor would actually spend the most time on float to the
  // top here too — the hub and the session should tell a consistent story.
  const skillIds = Object.keys(SKILLS[subject]).sort((a,b)=>skillPriorityScore(subject,b)-skillPriorityScore(subject,a));
  const rows = skillIds.map(id=>{
    const concept = STATE[subject].skills[id] || defaultConceptState();
    const rs = concept.lastSeenAt ? Math.round(retrievalStrengthNow(concept)*100) : null;
    const masteryPct = Math.round(concept.mastery*100);
    const dueTag = (rs !== null && rs < REVIEW_DUE_THRESHOLD*100)
      ? ` <span style="color:#d97706; font-weight:700;">· due for review</span>` : "";
    return `<div class="summary-stat" style="display:block;">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <span class="topic-name">${SKILLS[subject][id].label}${dueTag}</span>
        <span class="tier-badge t${Math.min(3,Math.floor((1-concept.mastery)*4))}">Year ${SKILLS[subject][id].year} ref</span>
      </div>
      <div class="explain">Mastery ${masteryPct}% · ${concept.lastSeenAt ? `memory freshness ${rs}%` : "not attempted yet"}</div>
      <button class="dashboard-btn" style="margin-top:8px;" onclick="startAdaptiveSession('${subject}','${id}')">Focus on this skill</button>
    </div>`;
  }).join("");
  app.innerHTML = `
    <div class="card">
      <button class="back-link" onclick="renderHome()">Home</button>

      <button class="next-btn" onclick="startAdaptiveSession('${subject}')">🎯 Practice ${cfg.label}</button>
      <h1 style="font-size:1.05rem; margin-top:18px;">Or focus on one skill</h1>
      ${rows}
    </div>`;
}

function startAdaptiveSession(subject, focusId){
  currentSubject = subject;
  primerAcknowledged = {};
  currentRound = subject === "history" ? buildAdaptiveSession(subject, focusId) : buildSkillSession(subject, focusId);
  currentIndex = 0;
  roundResults = [];
  renderAdaptiveQuestion();
}

function renderPrimer(q){
  const name = labelFor(currentSubject, q.topicId);
  app.innerHTML = `
    <div class="card">
      <button class="back-link" onclick="renderHome()">Exit</button>
      <span class="qtag">${q.qtag || name}</span>
      <p class="primer-text">📖 ${q.primer}</p>
      <button class="next-btn" onclick="acknowledgePrimer()">I've read it — let's go!</button>
    </div>`;
}
function acknowledgePrimer(){
  primerAcknowledged[currentRound[currentIndex].topicId] = true;
  renderAdaptiveQuestion();
}
window.acknowledgePrimer = acknowledgePrimer;

function renderAdaptiveQuestion(){
  const q = currentRound[currentIndex];
  if(q.primer && !primerAcknowledged[q.topicId]){ renderPrimer(q); return; }
  hintRevealed = false;
  questionShownAt = Date.now();
  const total = currentRound.length;
  const dots = currentRound.map((_,i)=>{
    let cls = "progress-dot";
    if(i < currentIndex) cls += " done";
    else if(i === currentIndex) cls += " current";
    return `<div class="${cls}"></div>`;
  }).join("");
  const name = labelFor(currentSubject, q.topicId);
  app.innerHTML = `
    <div class="card">
      <button class="back-link" onclick="renderHome()">Exit</button>
      <div class="progress-strip">${dots}</div>
      <span class="qtag">${q.qtag || name} · Q${currentIndex+1} of ${total}</span>
      <p class="question">${q.q}</p>
      <div class="options" id="options">
        ${q.options.map((opt,i)=>`<button class="opt" data-i="${i}" onclick="answerAdaptive(${i})">${opt}</button>`).join("")}
      </div>
      <div id="hintZone">
        <button class="dashboard-btn" onclick="revealHint()">💡 Hint</button>
      </div>
      <div id="feedbackZone"></div>
    </div>`;
}

    roman_numerals: "I=1, V=5, X=10, L=50, C=100. A smaller symbol before a bigger one means subtract; after means add.",
  },
  english: {
    fronted_adverbials: "Look for a phrase before the comma that tells you WHEN, WHERE, or HOW — that's the fronted adverbial.",
    spelling_patterns: "Say the word slowly and think about the spelling rule (doubling, changing y to i, adding es).",
    reading_literal: "The answer is stated directly in the passage — reread it and look for the exact fact.",
    reading_inference: "The answer isn't written directly — think about what the character's actions or feelings suggest.",
  },
};
const SUBJECT_HINTS = {
  math: Object.fromEntries(Object.keys(SKILLS.math).map(id =>
    [id, SKILL_HINTS_NEW.math[id] || TOPIC_HINTS_LEGACY.math[SKILL_SOURCE_TOPIC.math[id]] || null])),
  english: Object.fromEntries(Object.keys(SKILLS.english).map(id =>
    [id, SKILL_HINTS_NEW.english[id] || TOPIC_HINTS_LEGACY.english[SKILL_SOURCE_TOPIC.english[id]] || null])),
  history: {
    lincoln:          "Think back to what the passage said about him and the Civil War.",
    thanksgiving:     "Think back to who was involved and what happened in the story.",
    native_americans: "Think back to what the passage said about the people and tribes.",
    mlk:              "Think back to what the passage said about his message and his famous speech.",
    statue_of_liberty:"Think back to what the passage said about the statue and what it means.",
    map_capital:      "Think back to what the passage said about the states and the capital.",
  },
};
const SUBJECT_HINT_FALLBACK = {
  math: "Take your time and think it through step by step.",
  english: "Think about the rule you've learned for this.",
  history: "Think back to what the passage said.",
};
function revealHint(){
  const q = currentRound[currentIndex];
  hintRevealed = true;
  const hintText = (SUBJECT_HINTS[currentSubject] || {})[q.topicId] || SUBJECT_HINT_FALLBACK[currentSubject] || "Take your time.";
  const zone = document.getElementById("hintZone");
  if(zone) zone.innerHTML = `<div class="explain">💡 ${hintText}</div>`;
}
window.revealHint = revealHint;

function answerAdaptive(i){
  const q = currentRound[currentIndex];
  const wasCorrect = i === q.correctIndex;
  const responseTimeMs = questionShownAt ? Date.now() - questionShownAt : null;
  document.querySelectorAll(".opt").forEach((btn,idx)=>{
    btn.onclick = null;
    if(idx === q.correctIndex) btn.classList.add("correct");
    else if(idx === i) btn.classList.add("incorrect");
  });
  // Misconception tagging is numeric-pattern-based (off-by-ten/one) — only
  // meaningful for Math's numeric answers. English/History answers are
  // mostly text, where it would just always resolve to "conceptual" and add
  // noise rather than insight, so it's skipped for those two subjects.
  const misconceptionTag = (!wasCorrect && currentSubject === "math")
    ? classifyMisconception(q.options[q.correctIndex], q.options[i]) : null;
  const isHistory = currentSubject === "history";
  const beforeMastery = isHistory
    ? masteryAtTier(currentSubject, q.topicId, currentDisplayTier(currentSubject, q.topicId))
    : skillMastery(currentSubject, q.topicId);
  updateConcept(currentSubject, q.topicId, isHistory ? currentDisplayTier(currentSubject, q.topicId) : undefined, {
    wasCorrect, hintUsed: hintRevealed, responseTimeMs, misconceptionTag
  });
  // "Leveled up" = crossed the same 0.8 solid-mastery threshold the whole
  // model uses elsewhere (History's tier scan, the old currentDisplayTier)
  // — for skills this just means the skill itself crossed into "mastered"
  // territory, not that a Year boundary was crossed (skills don't have
  // Years to cross; see JC's 2026-08-01 redesign note).
  const afterMastery = isHistory
    ? masteryAtTier(currentSubject, q.topicId, currentDisplayTier(currentSubject, q.topicId))
    : skillMastery(currentSubject, q.topicId);
  const leveledUp = beforeMastery < 0.8 && afterMastery >= 0.8;
  const name = labelFor(currentSubject, q.topicId);
  roundResults.push({
    topicId:q.topicId, topicName:name, correct:wasCorrect, question:q.q, explain:q.explain,
    leveledUp, misconceptionTag
  });
  const fb = document.getElementById("feedbackZone");
  const levelNote = leveledUp
    ? `<div class="explain" style="color:#16a34a; font-weight:600;">⬆ ${name} mastery reached a solid level!</div>` : "";
  fb.innerHTML = `
    <div class="feedback ${wasCorrect?"good":"bad"}">${wasCorrect?"Nice one! ✅":"Not quite — here's why:"}</div>
    <div class="explain">${q.explain}</div>
    ${levelNote}
    <button class="next-btn" onclick="nextAdaptiveQuestion()">${currentIndex+1 < currentRound.length ? "Next question" : "See results"}</button>`;
}
window.answerAdaptive = answerAdaptive;

function nextAdaptiveQuestion(){
  currentIndex++;
  if(currentIndex >= currentRound.length){ renderAdaptiveSummary(); return; }
  renderAdaptiveQuestion();
}
window.nextAdaptiveQuestion = nextAdaptiveQuestion;

function renderAdaptiveSummary(){
  const cfg = CURRICULUM[currentSubject];
  const correctCount = roundResults.filter(r=>r.correct).length;
  const total = roundResults.length;
  const pct = Math.round((correctCount/total)*100);
  const emoji = pct >= 80 ? "🏆" : pct >= 50 ? "👍" : "💪";
  const leveledUpTopics = [...new Set(roundResults.filter(r=>r.leveledUp).map(r=>r.topicName))];
  const levelUpHTML = leveledUpTopics.length
    ? `<p class="explain" style="margin-top:10px;">⬆ Mastery moved up in: <strong>${leveledUpTopics.join(", ")}</strong></p>` : "";

  // Surface recurring misconception patterns from THIS session in plain
  // language, rather than just "missed 2" — this is the point of tracking
  // them at all: telling you and Grayson WHAT kind of mistake keeps showing up.
  const misconceptionCounts = {};
  roundResults.forEach(r=>{
    if(r.misconceptionTag) misconceptionCounts[r.misconceptionTag] = (misconceptionCounts[r.misconceptionTag]||0)+1;
  });
  const misconceptionHTML = Object.keys(misconceptionCounts).length
    ? `<div class="summary-stat" style="display:block;"><div class="topic-name">Patterns noticed today</div>` +
      Object.entries(misconceptionCounts).map(([tag,count])=>`<div class="explain">${tag} — ${count}×</div>`).join("") +
      `</div>` : "";

  app.innerHTML = `
    <div class="card">
      <div class="big-emoji">${emoji}</div>
      <h1 style="text-align:center;">${correctCount} / ${total} correct</h1>
      <p class="subtitle" style="text-align:center;">${cfg.label} session complete.</p>
      ${levelUpHTML}
      ${misconceptionHTML}
      <button class="next-btn" onclick="startAdaptiveSession('${currentSubject}')">Practice ${cfg.label} again</button>
      <button class="dashboard-btn" onclick="renderSubjectHub('${currentSubject}')">Back to ${cfg.label}</button>
      <button class="back-link" style="margin-top:10px;" onclick="renderHome()">Home</button>
    </div>`;
}

function renderDashboard(){
  const sections = Object.keys(CURRICULUM).map(subject=>{
    const cfg = CURRICULUM[subject];
    if(subject === "history"){
      const rows = cfg.topics.map(t=>{
        const tier = currentDisplayTier(subject, t.id);
        const concept = STATE[subject].topics[t.id].concepts[tier] || defaultConceptState();
        const rs = concept.lastSeenAt ? Math.round(retrievalStrengthNow(concept)*100) : null;
        const dueTag = (rs !== null && rs < REVIEW_DUE_THRESHOLD*100)
          ? ` <span style="color:#d97706; font-weight:700;">· due for review</span>` : "";
        const topMisconception = Object.entries(concept.misconceptions||{}).sort((a,b)=>b[1]-a[1])[0];
        const misconceptionLine = topMisconception
          ? `<div class="explain">Recurring pattern: ${topMisconception[0]} (${topMisconception[1]}×)</div>` : "";
        return `<div class="summary-stat" style="display:block;">
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <span class="topic-name">${t.name}${dueTag}</span>
            <span class="tier-badge t${tier % 4}">${cfg.tierLabels[tier]}</span>
          </div>
          <div class="explain">Mastery ${Math.round(concept.mastery*100)}% · confidence ${Math.round(concept.confidence*100)}%${rs!==null ? ` · memory freshness ${rs}%` : ""}</div>
          ${misconceptionLine}
        </div>`;
      }).join("");
      return `<h1 style="font-size:1.1rem; margin-top:18px;">${cfg.icon} ${cfg.label}</h1><p class="subject-summary">Reading-based — depth grows as topics are mastered.</p>${rows}`;
    }
    // Math/English: full skill-graph view, sorted by Priority Score
    // (highest first) so the ranking IS the answer to "why is the tutor
    // focusing on this today" — per JC, parents should see not just what
    // Grayson knows, but why today's session looked the way it did.
    const skillIds = Object.keys(SKILLS[subject]).sort((a,b)=>skillPriorityScore(subject,b)-skillPriorityScore(subject,a));
    const rows = skillIds.map(id=>{
      const concept = STATE[subject].skills[id] || defaultConceptState();
      const rs = concept.lastSeenAt ? Math.round(retrievalStrengthNow(concept)*100) : null;
      const priority = skillPriorityScore(subject, id);
      const reason = skillPriorityReason(subject, id);
      const dueTag = (rs !== null && rs < REVIEW_DUE_THRESHOLD*100)
        ? ` <span style="color:#d97706; font-weight:700;">· due for review</span>` : "";
      const topMisconception = Object.entries(concept.misconceptions||{}).sort((a,b)=>b[1]-a[1])[0];
      const misconceptionLine = topMisconception
        ? `<div class="explain">Recurring pattern: ${topMisconception[0]} (${topMisconception[1]}×)</div>` : "";
      return `<div class="summary-stat" style="display:block;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span class="topic-name">${SKILLS[subject][id].label}${dueTag}</span>
          <span class="tier-badge t${Math.min(3,Math.round(priority))}">Priority ${priority.toFixed(1)}</span>
        </div>
        <div class="explain">Mastery ${Math.round(concept.mastery*100)}% · confidence ${Math.round(concept.confidence*100)}%${rs!==null ? ` · memory freshness ${rs}%` : ""}</div>
        <div class="explain">Why: ${reason}</div>
        ${misconceptionLine}
      </div>`;
    }).join("");
    return `<h1 style="font-size:1.1rem; margin-top:18px;">${cfg.icon} ${cfg.label}</h1><p class="subject-summary">Sorted by priority — top of the list is where today's session would spend most of its time (60-70% repairing gaps, 20-30% maintaining strengths, 10-20% spaced review).</p>${rows}`;
  }).join("");
  app.innerHTML = `
    <div class="card">
      <button class="back-link" onclick="renderHome()">Home</button>
      <h1>Progress</h1>
      <p class="subtitle">This is how the app tracks and closes gaps over time.</p>
      ${sections}
    </div>`;
}

// Expose functions used by inline onclick handlers
window.renderHome = renderHome;
window.renderDashboard = renderDashboard;
window.renderSubjectHub = renderSubjectHub;
window.startAdaptiveSession = startAdaptiveSession;

renderHome();

// Cross-device sync check: render immediately from local state (above) so
// the app is never blocked waiting on a network call, then — if sync is on
// — pull whatever's in the cloud and adopt it ONLY if it's actually newer
// than what's on this device. Whichever side (local or cloud) has the more
// recent `updatedAt` wins; the loser is overwritten to match, so both sides
// converge on one shared progress record instead of silently forking.
if(SYNC_ENABLED){
  cloudPull().then(cloudState => {
    if(!cloudState) return; // nothing saved in the cloud yet — this device's save will seed it
    const migrated = migrateState(cloudState);
    if((migrated.updatedAt || 0) > (STATE.updatedAt || 0)){
      STATE = migrated;
      saveStateLocalOnly(STATE);
      // Don't yank the screen out from under a round in progress — the
      // merged state is already saved locally, so it'll be reflected the
      // moment he returns to Home or the Dashboard.
      if(!currentRound) renderHome();
    } else if((STATE.updatedAt || 0) > (migrated.updatedAt || 0)){
      cloudSync(STATE); // this device is ahead — push it up so the cloud catches up
    }
  });
}
</script>
</body>
</html>
